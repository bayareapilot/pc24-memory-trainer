<title>PC-24 Memory Trainer</title>
<style>
  :root {
    --ground: #f2f4f8;
    --panel: #ffffff;
    --panel-2: #e9edf3;
    --ink: #17202e;
    --muted: #5c6b80;
    --line: #d4dbe5;
    --accent: #0b7f9e;
    --accent-ink: #ffffff;
    --emer: #c62828;
    --limit: #a3660a;
    --agi: #1e7d46;
    --emer-bg: #fbeaea;
    --limit-bg: #f9efdd;
    --agi-bg: #e4f3ea;
    --good: #1e7d46;
    --again: #c62828;
    --shadow: 0 1px 3px rgba(23,32,46,.08), 0 4px 16px rgba(23,32,46,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0b1220;
      --panel: #131c2e;
      --panel-2: #0f1727;
      --ink: #e6edf7;
      --muted: #8da0ba;
      --line: #24324a;
      --accent: #3ec7e8;
      --accent-ink: #06202b;
      --emer: #ff5f5f;
      --limit: #ffb648;
      --agi: #4cd77e;
      --emer-bg: #2a1519;
      --limit-bg: #291f10;
      --agi-bg: #10251a;
      --good: #4cd77e;
      --again: #ff5f5f;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"] {
    --ground: #f2f4f8; --panel: #ffffff; --panel-2: #e9edf3; --ink: #17202e;
    --muted: #5c6b80; --line: #d4dbe5; --accent: #0b7f9e; --accent-ink: #ffffff;
    --emer: #c62828; --limit: #a3660a; --agi: #1e7d46;
    --emer-bg: #fbeaea; --limit-bg: #f9efdd; --agi-bg: #e4f3ea;
    --good: #1e7d46; --again: #c62828;
    --shadow: 0 1px 3px rgba(23,32,46,.08), 0 4px 16px rgba(23,32,46,.06);
  }
  :root[data-theme="dark"] {
    --ground: #0b1220; --panel: #131c2e; --panel-2: #0f1727; --ink: #e6edf7;
    --muted: #8da0ba; --line: #24324a; --accent: #3ec7e8; --accent-ink: #06202b;
    --emer: #ff5f5f; --limit: #ffb648; --agi: #4cd77e;
    --emer-bg: #2a1519; --limit-bg: #291f10; --agi-bg: #10251a;
    --good: #4cd77e; --again: #ff5f5f;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--ground); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    /* viewport-fit=cover is set for standalone mode, so pad past the notch and
       home indicator; the env() fallbacks are 0 in a normal browser tab. */
    padding: 0 calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 940px; margin: 0 auto; }

  header.app { padding: calc(28px + env(safe-area-inset-top)) 0 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  header.app h1 {
    font-family: "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 1.65rem; letter-spacing: .02em; margin: 0;
    text-transform: uppercase;
  }
  header.app .sub { color: var(--muted); font-size: .85rem; }

  nav.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
  nav.tabs button {
    appearance: none; background: none; border: none; cursor: pointer;
    font: 600 .92rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--muted); padding: 11px 16px 12px; margin-bottom: -2px;
    border-bottom: 2px solid transparent; letter-spacing: .03em; white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- shared bits ---- */
  .chip {
    display: inline-block; font: 700 .68rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .08em; padding: 4px 8px; border-radius: 4px; text-transform: uppercase;
  }
  .chip.E   { color: var(--emer);  background: var(--emer-bg); }
  .chip.L   { color: var(--limit); background: var(--limit-bg); }
  .chip.AGI { color: var(--agi);   background: var(--agi-bg); }

  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 8px; padding: 9px 16px; cursor: pointer;
    font: 600 .9rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.good  { border-color: var(--good);  color: var(--good); }
  .btn.again { border-color: var(--again); color: var(--again); }
  .btn.good:hover  { background: var(--good);  color: var(--ground); }
  .btn.again:hover { background: var(--again); color: var(--ground); }
  .btn:disabled { opacity: .45; cursor: default; }

  .statrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; min-width: 96px;
  }
  .stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; }

  /* ---- drill ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .controls label { font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: .9rem; max-width: 100%;
  }

  .card-stage { perspective: 1400px; }
  .fcard {
    position: relative; min-height: 340px; border-radius: 14px;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.1,.2,1);
    cursor: pointer;
  }
  /* Card height is set in JS to fit the taller face, so nothing scrolls inside a
     tap-to-flip target — critical on touch, where an inner scroll reads as a tap. */
  @media (prefers-reduced-motion: reduce) { .fcard { transition: none; } }
  .fcard.flipped { transform: rotateX(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 22px 26px 26px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .face.back { transform: rotateX(180deg); }
  .face .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex: none; }
  .face .cid { font: 700 .8rem/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); letter-spacing: .05em; }
  .face h2 {
    font-family: "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif;
    font-size: 1.45rem; font-weight: 700; margin: 0 0 12px; letter-spacing: .015em; text-wrap: balance;
  }
  .face .body { font-size: 1.02rem; white-space: pre-wrap; }
  .face.back .body { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92rem; line-height: 1.65; font-variant-numeric: tabular-nums; }
  .face .ref { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .78rem; flex: none; }
  .face .hint { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .82rem; flex: none; }
  .stripe { position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; }
  .stripe.E { background: var(--emer); } .stripe.L { background: var(--limit); } .stripe.AGI { background: var(--agi); }

  .grade { display: flex; gap: 10px; justify-content: center; margin-top: 18px; min-height: 44px; }
  .deckpos { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 12px; font-variant-numeric: tabular-nums; }

  .done-note {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 40px 28px; text-align: center; box-shadow: var(--shadow);
  }
  .done-note b { font-size: 1.2rem; }

  /* ---- program ---- */
  .phase { margin-bottom: 26px; }
  .phase > h3 {

  .history { margin-top: 26px; }

  .refgroup > h3 {

    font-size: 1.1rem; text-transform: uppercase; letter-spacing: .05em; margin: 22px 0 8px;
  }
  details.refcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 7px; overflow: hidden;
  }
  details.refcard summary {

    list-style: none; font-size: .92rem;
  }
  details.refcard summary::-webkit-details-marker { display: none; }
  details.refcard summary .cid { font: 700 .75rem/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); min-width: 46px; }
  details.refcard summary .mastery { margin-left: auto; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; flex: none; }
  details.refcard .inner { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  details.refcard .front { color: var(--muted); font-size: .88rem; white-space: pre-wrap; margin: 10px 0; }
  details.refcard .back {

    white-space: pre-wrap; background: var(--panel-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto;
  }
  details.refcard .ref { color: var(--muted); font-size: .76rem; margin-top: 8px; }

  #update-bar {
    display: none; align-items: center; gap: 12px; flex-wrap: wrap;

    font-size: .9rem; font-weight: 600;
  }
  #update-bar.show { display: flex; }
  #update-bar button {
    appearance: none; border: 1px solid currentColor; background: transparent;
    color: inherit; border-radius: 7px; padding: 6px 13px; cursor: pointer;

  }
  #update-bar button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .offline-dot {
    display: none; width: 7px; height: 7px; border-radius: 50%;

  }
  body.is-offline .offline-dot { display: inline-block; }
  footer { margin-top: 44px; color: var(--muted); font-size: .76rem; text-align: center; }

<script>
const CARDS = [{"id": "E-1", "title": "All Brakes Fail", "front": "Both the main brakes and emergency brake system are sensed to be inoperative.", "back": "On-ground during taxi:\nNOTE: Some brake pressure may still be available.\n1. Wheel brakes and EMER Brake — Use if available to stop aircraft", "reference": "QRH 3-BRKS-01"}, {"id": "E-2", "title": "Cabin Altitude", "front": "Cabin altitude above warning threshold and voice callout “CABIN ALTITUDE”.", "back": "1. Crew oxygen masks — Don/100%/Establish COMM\n2. Passenger oxygen — ON, Instruct passengers to don dropdown masks\nIF rapid or explosive decompression:\n3. Emergency Descent-3-NAE-02 — Accomplish", "reference": "QRH 3-ECS-01"}, {"id": "E-3", "title": "Cabin Pressure", "front": "Excessive positive or negative differential pressure.", "back": "In Flight with excessive negative differential pressure:\n1. Aircraft — Reduce descent rate", "reference": "QRH 3-ECS-02"}, {"id": "E-4", "title": "L ENG Fail / R ENG Fail", "front": "The indicated N1 has dropped 15% within 0.5 seconds. This will activate ATR during takeoff.", "back": "1. Engine instruments — Monitor / Confirm", "reference": "QRH 3-ENG-02"}, {"id": "E-5", "title": "L Engine Fire / R Engine Fire", "front": "The indicated Engine Fire detector senses a temperature above 510 °C. Additional indications: Audio “Left Engine Fire” callout, RED “FIRE” light on the associated Engine Isolation Pushbutton, Synoptic page: FIRE flag on Engine ITT indication, Red color of associated engine outline.", "back": "1. ENGINE FIRE — CONFIRM L or R\nIF Fire Confirmed:\n2. THRUST LEVER — IDLE\n3. ENGINE SWITCH — OFF / STOP\n4. ENGINE ISOLATION push button — PUSH\nCheck associated CAS “ENGINE ISOLATED” after five sec. CONFIRM ASSOCIATED green “1” illuminated.\nNOTE: If possible, keep pitch and bank angles to within ±10° to achieve maximum extinguisher effectiveness.\nIF CAS Message remains, affected side:\n5. EXTINGUISHER push button — PUSH", "reference": "QRH 3-FIRE-01"}, {"id": "E-6", "title": "ENGINE HUNG START ON GROUND", "front": "Indications: Engine Fails to Accelerate for > 30 Seconds.", "back": "1. Engine Switch — OFF", "reference": "QRH 3A-NAA-08"}, {"id": "E-7", "title": "ENGINE HOT START ON GROUND", "front": "Indications for Hot Start: Rapidly rising ITT approaching engine limits of 1,000 °C or ITT hanging between 900 °C and 1,000 °C for 15 seconds.", "back": "1. Engine Switch — OFF", "reference": "QRH 3A-NAA-07"}, {"id": "E-8", "title": "SWPS INADVERTENT PUSHER OPERATION", "front": "Non-commanded pusher operation, rapid nose-down motion.", "back": "WARNING: NATURAL STALLS ARE NOT PREVENTED WITH THE STICK PUSHER INOPERATIVE. STALLS MUST BE AVOIDED WHEN THE STICK PUSHER IS INOPERATIVE.\n1. Control wheel — Hold against pusher action\n2. AP disconnect button — Press and hold continuously", "reference": "QRH 3A-NAA-18"}, {"id": "E-9", "title": "ENGINE FIRE ON GROUND / TAIL PIPE FIRE", "front": "If during start, engine fire detector senses a temperature above 510 °C or else engine fire is indicated by ground personnel.", "back": "1. THRUST LEVER — IDENTIFY/IDLE Affected Engine\n2. ENG SWITCH — OFF\n3. ENG ISOL pushbutton — Push/check after 5 sec amber ENG ISOL; Confirm green “1”\n4. FIRE XTING pushbutton — Push to activate", "reference": "QRH 3-NAE-05"}, {"id": "E-10", "title": "ENGINE FIRE OR FAILURE DURING TAKEOFF", "front": "ENGINE FIRE OR FAILURE DURING TAKEOFF", "back": "Airspeed below V1:\n1. Rejected Takeoff - 3-NAE-19 — Accomplish\n-END-\nAirspeed at or above V1:\n1. THRUST levers — Fully forward, ATR\n2. VR — Rotate to 9° ANU Initially\n3. Airspeed — Maintain at or above V2\n4. L/G — When positive rate of climb – UP", "reference": "QRH 3-NAE-06"}, {"id": "E-11", "title": "REJECTED TAKEOFF", "front": "REJECTED TAKEOFF", "back": "CAUTION: IF AUTOTHROTTLE WAS ENGAGED FOR TAKEOFF, ENSURE AUTOTHROTTLE IS DISCONNECTED BY EITHER PRESSING AN AT DISC PUSHBUTTON OR HOLDING THE THROTTLES AT IDLE FOR 2 TO 3 SECONDS UNTIL AUTOTHROTTLE DISCONNECTS.\n1. THRUST levers — IDLE\n2. BRAKES — Max Braking / As Required", "reference": "QRH 3-NAE-19"}, {"id": "E-12", "title": "EMERGENCY DESCENT", "front": "EMERGENCY DESCENT", "back": "1. Crew Oxygen Masks — DON / 100% / Establish COMM\n2. PASSENGER OXYGEN — ON, instruct passengers to don dropdown masks\n3. SEAT BELTS — ON\n4. THRUST Levers — IDLE\n5. AIRBRAKE lever — OUT", "reference": "QRH 3-NAE-02"}, {"id": "E-13", "title": "SMOKE, FIRE, OR FUMES IN COCKPIT / CABIN", "front": "SMOKE, FIRE, OR FUMES IN COCKPIT / CABIN", "back": "IMMEDIATE ACTION IF SMOKE AND / OR FUMES ARE PERCEPTIBLE:\n1. CREW OXYGEN MASK — DON / select EMGCY / Vent valve open\n2. Smoke Goggles — DON\n3. Passenger OXYGEN — ON, Instruct PAX to don dropdown masks\nLAND ASAP / INITIATE DIVERSION\n4. Aircraft — Land as soon as possible", "reference": "QRH 3-SMOKE-01"}, {"id": "E-14", "title": "EMERGENCY EVACUATION", "front": "EMERGENCY EVACUATION", "back": "1. PARK BRAKE — Set\n2. ATC / distress message — Notify\n3. ENG L+R switches — Both OFF", "reference": "QRH 3-EVAC-01"}, {"id": "E-15", "title": "TCAS RESOLUTION ADVISORY", "front": "Accompanied by audio commands for climb, descend, level off or maintain vertical speed.", "back": "1. Autopilot — Use yoke quick disconnect if AP engaged\n2. Aircraft attitude — Immediately comply with RA commands indicated on the PFD\n3. ATC — Inform of TCAS RA\nWhen clear of conflict:\n4. Aircraft — Return to previously assigned altitude and advise ATC", "reference": "QRH 3B-FAS-20"}, {"id": "E-16", "title": "RH ENGINE START", "front": "RH ENGINE START", "back": "RH Engine — Start\nTo start the RH Engine:\n1. R Engine switch rotate to RUN\n2. Confirm R Booster pump running and no FUEL PRESSURE CAS messages appear\n3. R START Press", "reference": "AFM 4-PF-06"}, {"id": "E-17", "title": "RH ENGINE START (CONTINUED)", "front": "RH ENGINE START (CONTINUED)", "back": "1. Monitor start sequence as follows:\n2. When pressing start button “START” will appear “ON” on the PFD\n3. At about 10% N2, “START” and “IGN” is illuminated in inverse video. Check N1 is increasing\n4. Observe light-up and engine parameters until “IDL” is reached\n5. Depending on ambient conditions “START” and “IGN” extinguish at approximately 45% - 50% of N2", "reference": "AFM 4-PF-06"}, {"id": "E-18", "title": "LH ENGINE START", "front": "LH ENGINE START", "back": "1. LH Engine — Start\n• Start LH Engine Accordingly\nNOTE: The right engine must exit QPM and set to Ground Idle before Left Engine start", "reference": "AFM 4-PF-06"}, {"id": "E-19", "title": "ENGINE APPROXIMATE GND IDLE VALUES", "front": "ENGINE APPROXIMATE GND IDLE VALUES", "back": "N1: 25%\nITT: 400 °C\nN2: Min 53.4%\nFF: 160-180 lb\nConfirm GEN 2 takes over and is supplying the aircraft.\nNOTE: If TAT or reported OAT is <10 °C and visible signs of moisture are present then set the IPS rotary switch to AUTO/NAI.", "reference": "AFM 4-PF-06"}, {"id": "E-20", "title": "AFCS ABNORMAL DISCONNECT", "front": "AFCS ABNORMAL DISCONNECT", "back": "Indication: Flashing red “AP” on PFD and continuous “Cavalry Charge” aural warning.\n1. Airplane control wheel — Grasp firmly and regain aircraft control\n2. Autopilot Disengage switch — Press to cancel aural warning (pilot or copilot wheel)\n3. Aircraft — Retrim manually as necessary\nIf no AFCS associated CAS messages:\n4. Aircraft — Attempt to re-engage autopilot once", "reference": "QRH 3A-NAA-01"}, {"id": "E-21", "title": "CLIMB", "front": "CLIMB", "back": "1. Gear — UP\n• Confirm Lever Up and Lights Out on System Summary Page\n2. Yaw Damper — ON\n• Confirm on FMA\n3. Flaps — UP\n• Confirm lever at 0 and indication on System Summary Page\n4. Thrust — MCT\n• Thrust Levers back to MCT gate within five min after setting T/O\n• Verify MCT indications on both engine PFD indications", "reference": "AFM 4-IF-01"}, {"id": "L-1", "title": "Maximum Operating Speed", "front": "1. VMO (≤ 28,230 ft) — ?\n2. MMO (≥ 28,230 ft) — ?", "back": "1. VMO — 290 KIAS\n2. MMO — 0.74 M\nNOTE\nMMO schedule for maximum speed above 28,230 ft at this location.", "reference": "AFM Page 2-1-9"}, {"id": "L-2", "title": "Weight Limits", "front": "1. Max Zero Fuel Weight (MSN 101-500) — ?\n2. Max Ramp Weight (MSN 101-500) — ?\n3. Max Zero Fuel Weight (MSN 501-UP) — ?\n4. Max Ramp Weight (MSN 501-UP) — ?", "back": "1. Max Zero Fuel Weight (MSN 101-500) — 14,220 lbs (6,450 kg)\n2. Max Ramp Weight (MSN 101-500) — 18,400 lbs (8,345 kg)\n3. Max Zero Fuel Weight (MSN 501-UP) — 14,660 lbs (6650 kg)\n4. Max Ramp Weight (MSN 501-UP) — 18,840 lbs (8545 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-3", "title": "Weight Limits", "front": "1. Max Takeoff Weight (MSN 101-500) — ?\n2. Max Landing Weight (MSN 101-500) — ?\n3. Max Takeoff Weight (MSN 501-UP) — ?\n4. Max Landing Weight (MSN 501-UP) — ?", "back": "1. Max Takeoff Weight (MSN 101-500) — 18,300 lbs (8,300 kg)\n2. Max Landing Weight (MSN 101-500) — 16,900 lbs (7,665 kg)\n3. Max Takeoff Weight (MSN 501-UP) — 18,740 lbs (8,500 kg)\n4. Max Landing Weight (MSN 501-UP) — 17,340 lbs (7,865 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-4", "title": "Weight Limits", "front": "1. Maximum Baggage Weight (Small Restraint Net) — ?\n2. Maximum Baggage Weight (Large Restraint Net) — ?\n3. Maximum Cargo Weight (MSN 101-500) — ?\n4. Maximum Cargo Weight (MSN 500-UP) — ?", "back": "1. Maximum Baggage Weight (Small Restraint Net) — 400 lbs (180 kg)\n2. Maximum Baggage Weight (Large Restraint Net) — 530 lbs (240 kg)\n3. Maximum Cargo Weight (MSN 101-500) — 2,500 lbs (1,134 kg)\n4. Maximum Cargo Weight (MSN 501-UP) — 2,940 lbs (1,334 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-5", "title": "Loading Limits", "front": "1. Maximum Floor Loading (Over Floor Panels) — ?\n2. Maximum Floor Loading (On Seat Rails) — ?", "back": "1. Maximum Floor Loading (Over Floor Panels) — 100 lbs/ft² (500 kg/m²)\n2. Maximum Floor Loading (On Seat Rails) — 670 lbs/ft (1,000 kg/m)", "reference": "AFM Page 2-1-23"}, {"id": "L-6", "title": "Load Factor Limits", "front": "1. Flaps Up — ?\n2. Flaps Down — ?", "back": "1. Flaps Up — +3.0g ; -1.2g\n2. Flaps Down — +2.0g ; -0.0g", "reference": "AFM Page 2-1-24"}, {"id": "L-7", "title": "Operating Altitude Limits", "front": "Maximum Operating Altitude — ?", "back": "Maximum Operating Altitude — 45,000 ft (13,716 m)", "reference": "AFM Page 2-1-26"}, {"id": "L-8", "title": "Outside Air Temperature Limits", "front": "1. Minimum OAT (Sea Level) — ?\n2. Maximum OAT (Sea Level) — ?", "back": "1. Minimum OAT (Sea Level) — -54 °C (-67 °F)\n2. Maximum OAT (Sea Level) — +50 °C (122 °F)", "reference": "AFM Page 2-1-26"}, {"id": "L-9", "title": "Passenger Seating Limits", "front": "The maximum number of passengers in the Executive Interior Cabin is _____ passengers, including optional fit for two additional infants at first seating row left and right sides.", "back": "The maximum number of passengers in the Executive Interior Cabin is 8 passengers, including optional fit for two additional infants at first seating row left and right sides.", "reference": "AFM Page 2-1-25"}, {"id": "L-10", "title": "Airport Limits", "front": "1. Maximum Runway Slope — ?\n2. Approved Takeoff/Landing Surfaces — ?\n3. Contaminated Paved Runways — ?\nWith Gravel Kit Installed:\nDry/Wet Dirt-Sand-Gravel — ?\nDry/Wet Grass — ?", "back": "1. Maximum Runway Slope — ±2%\n2. Approved Takeoff/Landing Surfaces — Dry and Wet Paved Runways\n3. Contaminated Paved Runways — *Per AFM Supplement 02442\nWith Gravel Kit Installed:\n• Dry/Wet Dirt-Sand-Gravel — Per AFM Supplement 02444\n• Dry/Wet Grass — Per AFM Supplement 02473", "reference": "AFM Page 2-1-1, 2-1-2"}, {"id": "L-11", "title": "Airport Limits", "front": "1. Maximum Tailwind Component for takeoff and landing — ?\n2. Minimum Pressure Altitude — ?\n3. Maximum Pressure Altitude Landing Field Elevation — ?", "back": "Maximum Tailwind Component for Takeoff and Landing — 10 kt\nMinimum Pressure Altitude — -1,000 ft MSL\nMaximum Pressure Altitude Landing Field Elevation — 10,000 ft MSL", "reference": "AFM Page 2-1-2"}, {"id": "L-12", "title": "Engines", "front": "1. Number of Engines — ?\n2. Engine Manufacturer / Model Number — ?", "back": "1. Number of Engines — 2\n2. Engine Manufacturer / Model Number — Williams International FJ44-4A QPM", "reference": "AFM Page 1-1-2"}, {"id": "L-13", "title": "Oil Quantity", "front": "Oil level must not be below the ________ indicator mark on the oil tank sight glass prior to flight.", "back": "Oil level must not be below the ADD indicator mark on the oil tank sight glass prior to flight.", "reference": "AFM Page 2-1-26"}, {"id": "L-14", "title": "Engine Thrust Settings (LB)", "front": "1. Normal Takeoff Thrust — ?\n2. Automatic Thrust Reserve — ?", "back": "1. Normal Takeoff Thrust — 3,420 lbs\n2. Automatic Thrust Reserve — 3,600 lbs", "reference": "AFM Page 1-1-2"}, {"id": "L-15", "title": "Starter Duty Cycle Limits (Seconds)", "front": "1. Start Attempt 1 — ?\n2. Dry Motor Run — ?\n3. Start Attempt 2 — ?", "back": "1. Start Attempt 1 — ON (Start) - 50 Sec., OFF - 1 Min.\n2. Dry Motor Run — ON (Start) - 50 Sec., OFF - 1 Min.\n3. Start Attempt 2 — ON (Start) - 50 Sec., OFF - 30 Min.\nNOTE\nAbort engine start where N1 fails to increase by 25% N2.", "reference": "AFM Page 2-1-31, 2-1-32"}, {"id": "L-16", "title": "Engine Starting Limits", "front": "1. Maximum Tailwind Component for Engine Start — ?\n2. Maximum Crosswind Component for Engine Start — ?", "back": "1. Max. Tailwind Component for Engine Start — 20 kt\n2. Max. Crosswind Component for Engine Start — 25 kt Tower Wind", "reference": "AFM Page 2-1-31"}, {"id": "L-17", "title": "Engine Starting Limits", "front": "1. Minimum Time Between Engine Starts — ?\n2. Maximum Time to Light-off for Engine Start — ?", "back": "1. Minimum Time Between Engine Starts — 60 Seconds\n2. Maximum Time to Light-off for Engine Start — 12 Seconds", "reference": "AFM Page 2-1-31"}, {"id": "L-18", "title": "Engine Starting Limits", "front": "1. Minimum Ni-Cad Battery Voltage for Engine Start — ?\n2. Minimum Li-Ion Battery Voltage for Engine Start — ?\n3. Minimum Oil Temperature for Engine Start — ?", "back": "1. Min. Ni-Cad Battery Voltage for Engine Start — 22.0 VDC (BAT 1); 23.5 VDC (BAT 2)\n2. Min. Li-Ion Battery Voltage for Engine Start — State of Charge (SOC) indicators of both batteries green\n3. Min. Oil Temperature for Engine Start — -40 °C", "reference": "AFM Page 2-1-16"}, {"id": "L-19", "title": "Post Start Oil Temperature Limitations", "front": "The minimum oil temp for N2 > __ % or QPM operation is __ °C.", "back": "The minimum oil temp for N2 > 80% or QPM operation is +10 °C.", "reference": "AFM Page 2-1-32"}, {"id": "L-20", "title": "QPM Operation — Engine Limits", "front": "Activation of QPM is permitted after at least two minutes of stabilized operation at ________ N2. After QPM termination, run engine at ground idle thrust for at least _____ before shutdown or increasing thrust.", "back": "Activation of QPM is permitted after at least two minutes of stabilized operation at Ground Idle N2. After QPM termination, run engine at ground idle thrust for at least 2 Minutes before shutdown or increasing thrust.", "reference": "AFM Page 2-1-36"}, {"id": "L-21", "title": "QPM Operation — Engine Limits", "front": "QPM operation is permitted provided the aircraft remains stationary with the ____ on. The thrust lever remains ____ during QPM operation. The maximum generator load while in QPM of ___ is not exceeded.", "back": "QPM operation is permitted provided the aircraft remains stationary with the Park Brake on. The thrust lever remains IDLE during QPM operation. The maximum generator load while in QPM of 250 A is not exceeded.", "reference": "AFM Page 2-1-36"}, {"id": "L-22", "title": "Engine Cooldown", "front": "Engine shut-down is permitted when the engine has been run at idle thrust for more than __.", "back": "Engine shut-down is permitted when the engine has been run at idle thrust imum Volts to Charge Batteries — 28.0 VDC\n3. Maximum Volts to Charge Batteries — 29.5 VDC\n4. Minimum OAT for GPU Start — -54 °C", "reference": "AFM Page 2-1-16, 2-1-17"}, {"id": "L-37", "title": "Generator Limits", "front": "1. QPM — ?\n2. Ground Idle and Above — ?\n3. Flight — ?\n4. Maximum Voltage — ?", "back": "1. QPM — 250 A\n2. Ground Idle and Above — 400 A\n3. Flight — 400 A\n4. Maximum Voltage — 29.5 VDC", "reference": "AFM Page 2-1-16"}, {"id": "L-38", "title": "Battery Limits", "front": "1. Minimum Battery Temperature for Flight — ?\n2. Minimum Ni-Cd Battery Temperature — ?\n3. Minimum Li-Ion Battery Temperature — ?\n4. Minimum Ni-Cd Battery Volts for Start — ?\n5. Minimum Li-Ion Battery Volts for Start — ?\n6. Maximum Battery Charge Rate Before Takeoff — ?", "back": "1. Minimum Battery Temperature for Flight — 0 °C\n2. Minimum Ni-Cd Battery Temperature — -20 °C\n3. Minimum Li-Ion Battery Temperature — -5 °C\n4. Minimum Ni-Cd Battery Volts for Start — 22.0 VDC (Battery 1); 23.5 VDC (Battery 2)\n5. Min Li-Ion Battery Volts for Start — SOC Indicator on Both Batteries Green\n6. Maximum Battery Charge Rate Before Takeoff — Battery 1+2 must be <50 A and decreasing", "reference": "AFM Page 2-1-16"}, {"id": "L-39", "title": "Autopilot Limits", "front": "During autopilot operation, a pilot must be ___ in a pilot position with their ___ fastened.", "back": "During autopilot operation, a pilot must be seated in a pilot position with their seat belt fastened.", "reference": "AFM Page 2-1-3"}, {"id": "L-40", "title": "Autopilot Limits", "front": "The autopilot (AP) and yaw damper (YD) must be ___ during takeoff and landing.", "back": "The autopilot (AP) and yaw damper (YD) must be OFF during takeoff and landing.", "reference": "AFM Page 2-1-3"}, {"id": "L-41", "title": "Minimum A/P, Y/D, & A/T Altitudes", "front": "1. All operations except approach, A/P disengage by — ?\n2. Non-Precision, Circling, and Visual Approaches (a/s <150 KIAS & VS <1,500 ft/min) — ?\n3. Approaches in VGP mode — ?\n4. Coupled ILS approaches with G/S < 4.5° — ?", "back": "1. All operations except approach, A/P disengage by — 1,000 ft AGL\n2. Non-Precision, Circling, and Visual Approaches (a/s <150 KIAS & VS <1,500 ft/min) — 400 ft AGL\n3. Approaches in VGP mode — 200 ft AGL\n4. Coupled ILS approaches with G/S < 4.5° — 200 ft AGL", "reference": "AFM Page 2-1-3"}, {"id": "L-42", "title": "Yaw Damper Limits", "front": "Operation above ___ is prohibited with the Yaw Damper disengaged.", "back": "Operation above 30,000 feet MSL is prohibited with the Yaw Damper disengaged.", "reference": "AFM Page 2-1-3"}, {"id": "L-43", "title": "Severe Icing Conditions", "front": "Flight in freezing rain, freezing drizzle, or mixed icing conditions (supercooled liquid water and ice crystals) may result in ice build-up on protected surfaces exceeding the capability of the ___ ____ system, or may result in ice forming aft of the protected surfaces.", "back": "Flight in freezing rain, freezing drizzle, or mixed icing conditions (supercooled liquid water and ice crystals) may result in ice build-up on protected surfaces exceeding the capability of the Ice Protection system, or may result in ice forming aft of the protected surfaces.", "reference": "AFM Page 2-1-21"}, {"id": "L-44", "title": "Autopilot Usage in Icing Conditions", "front": "Care must be taken when using the autopilot that tactile cues, such as increased aileron forces, could potentially be masked by the autopilot function. Periodically ___ the autopilot to check for abnormal forces.", "back": "Care must be taken when using the autopilot that tactile cues, such as increased aileron forces, could potentially be masked by the autopilot function. Periodically disengage the autopilot to check for abnormal forces.", "reference": "AFM Page 2-1-21"}, {"id": "L-45", "title": "Nacelle Anti-Ice", "front": "The Nacelle Anti-ice (NAI) must be on for all ground operations, takeoff, and landing when:", "back": "The Nacelle Anti-ice (NAI) must be on for all ground operations, takeoff, and landing when:\n1. Visible moisture (i.e. standing water, slush, snow on taxi ways / runway) and indicated SAT or reported OAT <10 °C or\n2. Ice or other frozen precipitation is observed adhering to any part of the engine inlet.", "reference": "AFM Page 2-1-37"}, {"id": "L-46", "title": "Nacelle Anti-Ice", "front": "The NAI must be on for climb, cruise, and descent when:", "back": "The NAI must be on for climb, cruise, and descent when:\n1. In visible moisture with TAT <10 °C, or\n2. Flight through ice crystals, or\n3. Anytime ice accumulation is observed on the airframe", "reference": "AFM Page 2-1-37"}, {"id": "L-47", "title": "Nacelle Anti-Ice", "front": "Do not operate the NAI when the TAT is ___ °C. Do not operate the NAI during ___ operation. When required for takeoff, NAI must be selected ON prior to setting ___.", "back": "Do not operate the NAI when the TAT is >10 °C. Do not operate the NAI during QPM operation. When required for takeoff, NAI must be selected ON prior to setting takeoff power.", "reference": "AFM Page 2-1-37"}, {"id": "L-48", "title": "Horizontal Stabilizer De-Ice (HSDI)", "front": "Operation of the HSDI is not recommended when TAT < ___ unless required due to the presence of icing conditions.\nIf operated at TAT ≤ -40 °C, a ___ must be performed before takeoff.", "back": "Operation of the HSDI is not recommended when TAT < -40 °C unless required due to the presence of icing conditions.\nIf operated at TAT ≤ -40 °C, a visual inspection of the pneumatic boots and a system functional test must be performed before takeoff.", "reference": "AFM Page 2-1-19"}, {"id": "L-49", "title": "Oxygen System Limits", "front": "1. Minimum oxygen quantity for dispatch — ?\n2. Minimum oxygen supply for each occupant for pressurized flight above 25,000 feet MSL — ?", "back": "1. Minimum oxygen quantity for dispatch — 680 Liters\n2. Minimum oxygen supply for each occupant for pressurized flight above 25,000 feet MSL — 10 minutes", "reference": "AFM Page 2-1-28"}, {"id": "L-50", "title": "Electronic Charts", "front": "Pilots are responsible for taxiing by ___ and for flying by airborne navigation with use of ___.", "back": "Pilots are responsible for taxiing by external visual references and for flying by airborne navigation with use of primary navigation instruments.", "reference": "AFM Page 2-1-7"}, {"id": "L-51", "title": "Electronic Charts", "front": "Position accuracy of a chart aircraft symbol can decrease in the case of insufficient ___ or ____. The aircraft symbol is not in-scale with ACE™ Electronic Charts.", "back": "Position accuracy of a chart aircraft symbol can decrease in the case of insufficient GPS signal reception or GPS sensor failure. The aircraft symbol is not in-scale with ACE™ Electronic Charts.", "reference": "AFM Page 2-1-7"}, {"id": "L-52", "title": "Electronic Charts", "front": "ACE™ Electronic Charts do not replace approved ____ or approved ____.", "back": "ACE™ Electronic Charts do not replace approved published papers or approved electronic systems for aeronautical charts.", "reference": "AFM Page 2-1-7"}, {"id": "L-53", "title": "Weather Radar", "front": "Operation of the weather radar is prohibited:", "back": "Operation of the weather radar is prohibited:\n1. Within a hangar or other enclosure\n2. During airplane refueling/defueling operations\n3. With personnel present within the acceptable safe distance and ± 60° from the aircraft nose", "reference": "AFM Page 2-1-8"}, {"id": "L-54", "title": "INAV Map", "front": "1. The INAV topographical map shall not be used for primary ___.\n2. The display of airspace shall not be used as the ___.", "back": "1. The INAV topographical map shall not be used for primary navigation.\n2. The display of airspace shall not be used as the sole airspace reference.", "reference": "AFM Page 2-1-8"}, {"id": "L-55", "title": "Smart View (SV)", "front": "Operations using Smart View are permitted when it is /* ---------- static structure ---------- */
const SECTIONS = { E: 'Emergency', L: 'Limitations', AGI: 'Aircraft General' };
const sec = id => id.startsWith('AGI') ? 'AGI' : id[0];

const range = (p, a, b) => Array.from({length: b - a + 1}, (_, i) => `${p}-${a + i}`);
const DAYS = [
  { d: 'Day 1', title: 'Emergency core — fire & RTO, masks-first + speed ladder', ids: ['E-5','E-9','E-10','E-11','E-2','E-3','E-12','E-13','L-1','L-28','L-29','L-30'], phase: 1, note: 'Wed Jul 29 (tonight) · ~90 min · write each emergency flow by hand once' },
  { d: 'Day 2', title: 'Emergency remainder — ground malfunctions + automation', ids: ['E-1','E-6','E-7','E-14','E-4','E-8','E-15','E-20'], phase: 1, note: 'Thu Jul 30 (class day 1) · 45–60 min · re-drill Day 1 misses first' },
  { d: 'Day 3', title: 'Start & climb flows + weights (+440 rule)', ids: [...range('E',16,19),'E-21',...range('L',2,6)], exam: 'cp3', phase: 1, note: 'Fri Jul 31 · ~60 min · finish with Checkpoint 3 — goal ≥90% tonight' },
  { d: 'Day 4 AM', title: 'Engine & starter + envelope & airport', ids: [...range('L',12,22), ...range('L',7,11)], phase: 2, note: 'Sat Aug 1 · 60–75 min' },
  { d: 'Day 4 PM', title: 'Fuel & oxygen + electrical', ids: [...range('L',23,27),'L-49',...range('L',34,38)], exam: 'cp3', phase: 2, note: 'Sat Aug 1 · ~60 min · re-run Checkpoint 3 to 100% verbatim' },
  { d: 'Day 5 AM', title: 'Cabin & AFCS + icing', ids: [...range('L',31,33), ...range('L',39,42), ...range('L',43,48)], phase: 2, note: 'Sun Aug 2 · 60–75 min' },
  { d: 'Day 5 PM', title: 'Avionics + Aircraft General', ids: [...range('L',50,57), ...range('AGI',1,9)], exam: 'cp1', phase: 2, note: 'Sun Aug 2 · ~60 min · finish with Checkpoint 1' },
  { d: 'Day 6', title: 'No new cards — Checkpoint 2 + emergency verbatim re-pass', ids: null, exam: 'cp2', phase: 3, note: 'Mon Aug 3 · 45–60 min · ≥90%, then drill every miss to clean' },
  { d: 'Day 7', title: 'Final check + mock oral', ids: null, exam: 'full', phase: 3, note: 'Tue Aug 4 · 45–60 min · limitations exact, emergency verbatim, then drill Due to zero' },
];
const PHASES = {
  1: 'Phase 1 · Emergency first (Days 1–3 · Jul 29–31)',
  2: 'Phase 2 · Limitations blitz (Days 4–5 · the weekend)',
  3: 'Phase 3 · Checkpoints & final (Days 6–7 · Aug 3–4)',
};
const EXAM_SCOPES = {
  cp1: { ids: () => DAYS.slice(0,5).flatMap(x => x.ids || []).filter(id => sec(id) === 'L'), pass: 90 },
  cp2: { ids: () => CARDS.filter(c => sec(c.id) !== 'E').map(c => c.id), pass: 90 },
  cp3: { ids: () => CARDS.filter(c => sec(c.id) === 'E').map(c => c.id), pass: 100 },
  mock: { ids: () => shuffle(CARDS.map(c => c.id)).slice(0,30), pass: 90 },
  full: { ids: () => CARDS.map(c => c.id), pass: 100 },
};
const REF_GROUPS = [
  ['Emergency — memory items & flows', CARDS.filter(c => sec(c.id) === 'E')],
  ['Limitations', CARDS.filter(c => sec(c.id) === 'L')],
  ['Aircraft General', CARDS.filter(c => sec(c.id) === 'AGI')],
];
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));

/* ---------- state ---------- */
const LS_KEY = 'pc24-trainer-v1';
let state = { srs: {}, exams: [] };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };

const DAY_MS = 86400e3;
const INTERVALS = [0, 1, 3, 7, 7]; // box -> days until due
function grade(id, ok) {
  const rec = state.srs[id] || { box: 0 };
  rec.box = ok ? Math.min(rec.box + 1, 4) : 1;
  rec.due = Date.now() + INTERVALS[rec.box] * DAY_MS;
  rec.seen = (rec.seen || 0) + 1;
  state.srs[id] = rec; save();
}
const isNew = id => !state.srs[id];
const isDue = id => state.srs[id] && state.srs[id].due <= Date.now();
const isLearned = id => state.srs[id] && state.srs[id].box >= 3;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- tabs ---------- */
const tabs = document.querySelectorAll('nav.tabs button');
function show(view) {
  tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  if (view === 'drill') renderDrillStats();
}
tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

/* ---------- program view ---------- */
function renderProgram() {
  const el = document.getElementById('view-program');
  let html = '';
  let phase = 0;
  for (const day of DAYS) {
    if (day.phase !== phase) {
      if (phase) html += '</div>';
      phase = day.phase;
      html += `<div class="phase"><h3>${PHASES[phase]}</h3>`;
    }
    const ids = day.ids;
    const stats = ids ? `${ids.length} cards · ${ids.filter(isLearned).length} learned` : (day.note || '');
    html += `<div class="dayrow${day.exam ? ' checkpoint' : ''}">
      <span class="d">${day.d}</span>
      <span class="t">${esc(day.title)}<small>${esc(ids ? ids.join(', ') : '')}${ids && day.note ? ' · ' : ''}${esc(ids ? (day.note || '') : '')}${!ids ? esc(day.note || '') : ''}</small></span>
      ${ids ? `<button class="btn" data-drill='${JSON.stringify(ids)}'>Drill</button>` : ''}
      ${day.exam ? `<button class="btn primary" data-exam="${day.exam}">Run exam</button>` : ''}
      ${ids ? `<span class="chip ${sec(ids[0])}">${stats}</span>` : ''}
    </div>`;
  }
  html += '</div>';
  html += `<div class="phase"><h3>Maintenance — rest of class (Aug 5 onward)</h3>
    <div class="dayrow"><span class="d">Daily</span>
    <span class="t">10 minutes on due cards every evening<small>If class runs the weekend, split each Sat/Sun block into that evening + the next morning</small></span>
    <button class="btn" data-drill="due">Drill due cards</button></div></div>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-drill]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.drill;
    startDrill(v === 'due' ? CARDS.map(c => c.id).filter(isDue) : JSON.parse(v), true);
    show('drill');
  }));
  el.querySelectorAll('[data-exam]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('exam-scope').value = b.dataset.exam;
    startExam(b.dataset.exam);
    show('exam');
  }));
}

/* ---------- drill view ---------- */
const scopeSel = document.getElementById('drill-scope');
function renderScopeOptions() {
  let html = '<option value="all">Full deck (87)</option><option value="due">Due today</option>';
  for (const s of ['E','L','AGI']) html += `<option value="sec:${s}">${SECTIONS[s]}</option>`;
  DAYS.forEach((day, i) => { if (day.ids && day.ids.length < 87) html += `<option value="day:${i}">${day.d} — ${day.title}</option>`; });
  scopeSel.innerHTML = html;
}
function scopeIds(v) {
  if (v === 'all') return CARDS.map(c => c.id);
  if (v === 'due') return CARDS.map(c => c.id).filter(isDue);
  if (v.startsWith('sec:')) return CARDS.filter(c => sec(c.id) === v.slice(4)).map(c => c.id);
  if (v.startsWith('day:')) return DAYS[+v.slice(4)].ids;
  return [];
}
function renderDrillStats() {
  const ids = CARDS.map(c => c.id);
  const stats = [
    ['New', ids.filter(isNew).length],
    ['Due', ids.filter(isDue).length],
    ['Learning', ids.filter(id => !isNew(id) && !isLearned(id)).length],
    ['Learned', ids.filter(isLearned).length],
  ];
  document.getElementById('drill-stats').innerHTML =
    stats.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
}

/* Grow the card to fit whichever face is taller. Both faces are absolutely
   positioned for the 3D flip, so the container needs an explicit height —
   without it, long emergency flows scroll inside a tap-to-flip surface. */
function sizeCard(fc) {
  if (!fc) return;
  fc.style.height = 'auto';
  const faces = [...fc.querySelectorAll('.face')];
  // scrollHeight is content + padding but excludes the border that clientHeight
  // also excludes, so add the border delta or every grown card ends up 2px short.
  const needed = Math.max(340, ...faces.map(f => f.scrollHeight + (f.offsetHeight - f.clientHeight)));
  fc.style.height = needed + 'px';
}
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => sizeCard(document.getElementById('fcard')), 120);
});

let deck = [], pos = 0;
function startDrill(ids, forceOrder) {
  const dueFirst = document.getElementById('drill-due-first').checked;
  const doShuffle = document.getElementById('drill-shuffle').checked;
  let list = ids.slice();
  if (doShuffle && !forceOrder) list = shuffle(list);
  if (dueFirst) {
    const rank = id => isDue(id) ? 0 : isNew(id) ? 1 : 2;
    list.sort((a, b) => rank(a) - rank(b));
  }
  deck = list; pos = 0;
  renderCard();
}
document.getElementById('drill-start').addEventListener('click', () => startDrill(scopeIds(scopeSel.value)));

function renderCard() {
  const area = document.getElementById('drill-area');
  if (!deck.length) { area.innerHTML = '<div class="done-note"><b>Nothing to drill.</b><br>No cards match this scope — nice.</div>'; return; }
  if (pos >= deck.length) {
    area.innerHTML = `<div class="done-note"><b>Session complete — ${deck.length} cards.</b><br>
      Misses come back tomorrow; clean cards move out on the 1–3–7 schedule.<br><br>
      <button class="btn primary" id="drill-again">Run this deck again</button></div>`;
    document.getElementById('drill-again').addEventListener('click', () => { pos = 0; renderCard(); });
    renderDrillStats(); renderProgram();
    return;
  }
  const c = byId[deck[pos]];
  const s = sec(c.id);
  area.innerHTML = `
    <div class="card-stage">
      <div class="fcard" id="fcard" tabindex="0" role="button" aria-label="Flash card — activate to flip">
        <div class="face front">
          <div class="stripe ${s}"></div>
          <div class="topline"><span class="chip ${s}">${SECTIONS[s]}</span><span class="cid">${c.id}</span></div>
          <h2>${esc(c.title)}</h2>
          <div class="body">${esc(c.front)}</div>
          <div class="hint">Recall out loud, then click or press Space to flip</div>
        </div>
        <div class="face back">
          <div class="stripe ${s}"></div>
          <div class="topline"><span class="chip ${s}">${SECTIONS[s]}</span><span class="cid">${c.id}A</span></div>
          <h2>${esc(c.title)}</h2>
          <div class="body">${esc(c.back)}</div>
          <div class="ref">${esc(c.reference)}</div>
        </div>
      </div>
    </div>
    <div class="grade" id="grade"></div>
    <div class="deckpos">${pos + 1} / ${deck.length}</div>`;
  const fc = document.getElementById('fcard');
  sizeCard(fc);
  const flip = () => {
    fc.classList.toggle('flipped');
    document.getElementById('grade').innerHTML = fc.classList.contains('flipped')
      ? `<button class="btn again" id="g-again">✗ Again</button><button class="btn good" id="g-good">✓ Got it</button>`
      : '';
    if (fc.classList.contains('flipped')) {
      document.getElementById('g-again').addEventListener('click', e => { e.stopPropagation(); grade(c.id, false); deck.push(c.id); pos++; renderCard(); });
      document.getElementById('g-good').addEventListener('click', e => { e.stopPropagation(); grade(c.id, true); pos++; renderCard(); });
    }
  };
  fc.addEventListener('click', e => { if (e.target.closest('.grade')) return; flip(); });
  fc.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  fc.focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('view-drill').classList.contains('active')) return;
  if (e.target.matches('input,select,textarea')) return;
  const fc = document.getElementById('fcard');
  if (!fc || !fc.classList.contains('flipped')) return;
  if (e.key === '1') document.getElementById('g-again')?.click();
  if (e.key === '2') document.getElementById('g-good')?.click();
});

/* ---------- exam view ---------- */
let exam = null;
function startExam(scopeKey) {
  const scope = EXAM_SCOPES[scopeKey];
  exam = { key: scopeKey, ids: shuffle(scope.ids()), pass: scope.pass, i: 0, correct: [], missed: [], revealed: false };
  renderExam();
}
document.getElementById('exam-start').addEventListener('click', () => startExam(document.getElementById('exam-scope').value));

function renderExam() {
  const area = document.getElementById('exam-area');
  if (!exam) { area.innerHTML = ''; renderExamHistory(); return; }
  if (exam.i >= exam.ids.length) {
    const pct = Math.round(100 * exam.correct.length / exam.ids.length);
    const passed = pct >= exam.pass;
    state.exams.push({ when: new Date().toISOString().slice(0, 10), key: exam.key, pct, n: exam.ids.length, passed });
    save();
    area.innerHTML = `<div class="done-note">
      <b class="${passed ? 'pass' : 'fail'}">${pct}% — ${passed ? 'PASS' : 'below standard'} (need ${exam.pass}%)</b>
      <div class="exam-score">${exam.correct.length} of ${exam.ids.length} correct</div>
      ${exam.missed.length ? `<div style="text-align:left"><b>Re-drill these:</b><ul class="misslist">${exam.missed.map(id => `<li><b>${id}</b> — ${esc(byId[id].title)}</li>`).join('')}</ul></div>
      <br><button class="btn primary" id="exam-redrill">Drill the misses now</button>` : 'Clean sweep.'}
    </div>`;
    document.getElementById('exam-redrill')?.addEventListener('click', () => { startDrill(exam.missed.slice(), true); exam = null; renderExamHistory(); show('drill'); });
    exam = exam && null;
    renderExamHistory();
    return;
  }
  const c = byId[exam.ids[exam.i]];
  const s = sec(c.id);
  area.innerHTML = `<div class="exam-q">
      <div class="topline" style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <span class="chip ${s}">${SECTIONS[s]}</span>
        <span class="cid" style="font:700 .8rem/1 ui-monospace,'SF Mono',Menlo,monospace;color:var(--muted)">${c.id}</span>
        <span style="margin-left:auto;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums">${exam.i + 1} / ${exam.ids.length}</span>
      </div>
      <h2 style="font-family:'Avenir Next Condensed','Helvetica Neue','Arial Narrow',sans-serif;font-size:1.3rem;margin:0 0 10px">${esc(c.title)}</h2>
      <div style="white-space:pre-wrap">${esc(c.front)}</div>
      ${exam.revealed ? `<div class="answer">${esc(c.back)}</div>` : ''}
    </div>
    <div class="exam-actions">
      ${exam.revealed
        ? `<button class="btn again" id="ex-miss">✗ Missed it</button><button class="btn good" id="ex-hit">✓ Had it</button>`
        : `<button class="btn primary" id="ex-reveal">Answer out loud, then reveal</button>`}
    </div>`;
  document.getElementById('ex-reveal')?.addEventListener('click', () => { exam.revealed = true; renderExam(); });
  document.getElementById('ex-hit')?.addEventListener('click', () => { exam.correct.push(c.id); grade(c.id, true); exam.i++; exam.revealed = false; renderExam(); });
  document.getElementById('ex-miss')?.addEventListener('click', () => { exam.missed.push(c.id); grade(c.id, false); exam.i++; exam.revealed = false; renderExam(); });
}
function renderExamHistory() {
  const el = document.getElementById('exam-history');
  if (!state.exams.length) { el.innerHTML = ''; return; }
  const names = { cp1: 'Checkpoint 1', cp2: 'Checkpoint 2', cp3: 'Checkpoint 3', mock: 'Mock oral', full: 'Final check' };
  el.innerHTML = `<h3 style="font-family:'Avenir Next Condensed','Helvetica Neue','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:1.05rem">Attempt history</h3>
    <table><thead><tr><th>Date</th><th>Exam</th><th>Cards</th><th>Score</th><th>Result</th></tr></thead><tbody>
    ${state.exams.slice().reverse().map(e => `<tr><td>${e.when}</td><td>${names[e.key] || e.key}</td><td>${e.n}</td><td>${e.pct}%</td><td class="${e.passed ? 'pass' : 'fail'}">${e.passed ? 'PASS' : '—'}</td></tr>`).join('')}
    </tbody></table>`;
}

/* ---------- reference view ---------- */
function renderReference(filter) {
  const q = (filter || '').trim().toLowerCase();
  const el = document.getElementById('ref-list');
  let html = '';
  for (const [name, cards] of REF_GROUPS) {
    const hits = cards.filter(c => !q || (c.id + ' ' + c.title + ' ' + c.front + ' ' + c.back).toLowerCase().includes(q));
    if (!hits.length) continue;
    html += `<div class="refgroup"><h3>${name} (${hits.length})</h3>` + hits.map(c => {
      const m = isLearned(c.id) ? 'learned' : isNew(c.id) ? 'new' : 'learning';
      return `<details class="refcard" ${q ? 'open' : ''}>
        <summary><span class="cid">${c.id}</span> ${esc(c.title)} <span class="mastery">${m}</span></summary>
        <div class="inner"><div class="front">${esc(c.front)}</div><div class="back">${esc(c.back)}</div><div class="ref">${esc(c.reference)}</div></div>
      </details>`;
    }).join('') + '</div>';
  }
  el.innerHTML = html || '<p style="color:var(--muted)">No cards match.</p>';
}
document.getElementById('ref-search').addEventListener('input', e => renderReference(e.target.value));

/* ---------- boot ---------- */
renderProgram();
renderScopeOptions();
renderDrillStats();
renderReference('');
renderExamHistory();

/* ---------- offline support (PWA) ----------
   Registration is guarded: on file:// or a host without the worker this simply
   does nothing and the app still runs — it just won't cache for offline use. */
(function () {
  const bar = document.getElementById('update-bar');
  const showUpdate = reg => {
    bar.classList.add('show');
    document.getElementById('update-now').onclick = () => {
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      // controllerchange fires once the new worker takes over; reload then so the
      // fresh card set is what actually loads.
      navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      setTimeout(() => location.reload(), 1200); // fallback if the event never lands
    };
  };

  const markOnline = () => document.body.classList.toggle('is-offline', !navigator.onLine);
  window.addEventListener('online', markOnline);
  window.addEventListener('offline', markOnline);
  markOnline();

  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          // Only prompt when replacing an existing worker — not on first install.
          if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg);
        });
      });
      // Check for a new version on launch and hourly while the app stays open.
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 3600e3);
    }).catch(() => {});
  });
})();
</script>
