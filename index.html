<title>PC-24 Memory Trainer</title>
<style>
  :root {
    --ground: #f2f4f8;
    --panel: #ffffff;
    --panel-2: #e9edf3;
    --ink: #17202e;
    --muted: #5c6b80;
    --line: #d4dbe5;
    --accent: #0b7f9e;
    --accent-ink: #ffffff;
    --emer: #c62828;
    --limit: #a3660a;
    --agi: #1e7d46;
    --afm: #6b4ea8;
    --ace: #0f6f6c;
    --emer-bg: #fbeaea;
    --afm-bg: #efeaf8;
    --ace-bg: #e2f1f0;
    --limit-bg: #f9efdd;
    --agi-bg: #e4f3ea;
    --good: #1e7d46;
    --again: #c62828;
    --shadow: 0 1px 3px rgba(23,32,46,.08), 0 4px 16px rgba(23,32,46,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0b1220;
      --panel: #131c2e;
      --panel-2: #0f1727;
      --ink: #e6edf7;
      --muted: #8da0ba;
      --line: #24324a;
      --accent: #3ec7e8;
      --accent-ink: #06202b;
      --emer: #ff5f5f;
      --limit: #ffb648;
      --agi: #4cd77e;
      --afm: #b79be8;
      --ace: #57ccc6;
      --emer-bg: #2a1519;
      --afm-bg: #221a33;
      --ace-bg: #0d2726;
      --limit-bg: #291f10;
      --agi-bg: #10251a;
      --good: #4cd77e;
      --again: #ff5f5f;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"] {
    --ground: #f2f4f8; --panel: #ffffff; --panel-2: #e9edf3; --ink: #17202e;
    --muted: #5c6b80; --line: #d4dbe5; --accent: #0b7f9e; --accent-ink: #ffffff;
    --emer: #c62828; --limit: #a3660a; --agi: #1e7d46; --afm: #6b4ea8; --ace: #0f6f6c;
    --emer-bg: #fbeaea; --limit-bg: #f9efdd; --agi-bg: #e4f3ea; --afm-bg: #efeaf8; --ace-bg: #e2f1f0;
    --good: #1e7d46; --again: #c62828;
    --shadow: 0 1px 3px rgba(23,32,46,.08), 0 4px 16px rgba(23,32,46,.06);
  }
  :root[data-theme="dark"] {
    --ground: #0b1220; --panel: #131c2e; --panel-2: #0f1727; --ink: #e6edf7;
    --muted: #8da0ba; --line: #24324a; --accent: #3ec7e8; --accent-ink: #06202b;
    --emer: #ff5f5f; --limit: #ffb648; --agi: #4cd77e; --afm: #b79be8; --ace: #57ccc6;
    --emer-bg: #2a1519; --limit-bg: #291f10; --agi-bg: #10251a; --afm-bg: #221a33; --ace-bg: #0d2726;
    --good: #4cd77e; --again: #ff5f5f;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--ground); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    /* viewport-fit=cover is set for standalone mode, so pad past the notch and
       home indicator; the env() fallbacks are 0 in a normal browser tab. */
    padding: 0 calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 940px; margin: 0 auto; }

  header.app { padding: calc(28px + env(safe-area-inset-top)) 0 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  header.app h1 {
    font-family: "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 1.65rem; letter-spacing: .02em; margin: 0;
    text-transform: uppercase;
  }
  header.app .sub { color: var(--muted); font-size: .85rem; }

  nav.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
  nav.tabs button {
    appearance: none; background: none; border: none; cursor: pointer;
    font: 600 .92rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--muted); padding: 11px 16px 12px; margin-bottom: -2px;
    border-bottom: 2px solid transparent; letter-spacing: .03em; white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- shared bits ---- */
  .chip {
    display: inline-block; font: 700 .68rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .08em; padding: 4px 8px; border-radius: 4px; text-transform: uppercase;
  }
  .chip.E   { color: var(--emer);  background: var(--emer-bg); }
  .chip.L   { color: var(--limit); background: var(--limit-bg); }
  .chip.AGI { color: var(--agi);   background: var(--agi-bg); }
  .chip.AFM { color: var(--afm);   background: var(--afm-bg); }
  .chip.ACE { color: var(--ace);   background: var(--ace-bg); }

  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 8px; padding: 9px 16px; cursor: pointer;
    font: 600 .9rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.good  { border-color: var(--good);  color: var(--good); }
  .btn.again { border-color: var(--again); color: var(--again); }
  .btn.good:hover  { background: var(--good);  color: var(--ground); }
  .btn.again:hover { background: var(--again); color: var(--ground); }
  .btn:disabled { opacity: .45; cursor: default; }

  .statrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; min-width: 96px;
  }
  .stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; }

  /* ---- drill ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .controls label { font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: .9rem; max-width: 100%;
  }

  .card-stage { perspective: 1400px; }
  .fcard {
    position: relative; min-height: 340px; border-radius: 14px;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.1,.2,1);
    cursor: pointer;
  }
  /* Card height is set in JS to fit the taller face, so nothing scrolls inside a
     tap-to-flip target — critical on touch, where an inner scroll reads as a tap. */
  @media (prefers-reduced-motion: reduce) { .fcard { transition: none; } }
  .fcard.flipped { transform: rotateX(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 22px 26px 26px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .face.back { transform: rotateX(180deg); }
  .face .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex: none; }
  .face .cid { font: 700 .8rem/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); letter-spacing: .05em; }
  .face h2 {
    font-family: "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif;
    font-size: 1.45rem; font-weight: 700; margin: 0 0 12px; letter-spacing: .015em; text-wrap: balance;
  }
  .face .body { font-size: 1.02rem; white-space: pre-wrap; }
  .face.back .body { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92rem; line-height: 1.65; font-variant-numeric: tabular-nums; }
  .face .ref { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .78rem; flex: none; }
  .face .hint { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .82rem; flex: none; }
  .stripe { position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; }

  .pass { color: var(--good); font-weight: 700; }

  details.refcard {

  details.refcard summary {

  details.refcard summary::-webkit-details-marker { display: none; }

  details.refcard summary .mastery { margin-left: auto; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; flex: none; }
  details.refcard .inner { padding: 4px 16px 16px; border-top: 1px solid var(--line); }

  details.refcard .back {

    white-space: pre-wrap; background: var(--panel-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto;
  }

  #update-bar {
    display: none; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--accent); color: var(--accent-ink);

  .offline-dot {

  }
  body.is-offline .offline-dot { display: inline-block; }
  footer { margin-top: 44px; color: var(--muted); font-size: .76rem; text-align: center; }

<script>
const CARDS = [{"id": "E-1", "title": "All Brakes Fail", "front": "Both the main brakes and emergency brake system are sensed to be inoperative.", "back": "On-ground during taxi:\nNOTE: Some brake pressure may still be available.\n1. Wheel brakes and EMER Brake — Use if available to stop aircraft", "reference": "QRH 3-BRKS-01"}, {"id": "E-2", "title": "Cabin Altitude", "front": "Cabin altitude above warning threshold and voice callout “CABIN ALTITUDE”.", "back": "1. Crew oxygen masks — Don/100%/Establish COMM\n2. Passenger oxygen — ON, Instruct passengers to don dropdown masks\nIF rapid or explosive decompression:\n3. Emergency Descent-3-NAE-02 — Accomplish", "reference": "QRH 3-ECS-01"}, {"id": "E-3", "title": "Cabin Pressure", "front": "Excessive positive or negative differential pressure.", "back": "In Flight with excessive negative differential pressure:\n1. Aircraft — Reduce descent rate", "reference": "QRH 3-ECS-02"}, {"id": "E-4", "title": "L ENG Fail / R ENG Fail", "front": "The indicated N1 has dropped 15% within 0.5 seconds. This will activate ATR during takeoff.", "back": "1. Engine instruments — Monitor / Confirm", "reference": "QRH 3-ENG-02"}, {"id": "E-5", "title": "L Engine Fire / R Engine Fire", "front": "The indicated Engine Fire detector senses a temperature above 510 °C. Additional indications: Audio “Left Engine Fire” callout, RED “FIRE” light on the associated Engine Isolation Pushbutton, Synoptic page: FIRE flag on Engine ITT indication, Red color of associated engine outline.", "back": "1. ENGINE FIRE — CONFIRM L or R\nIF Fire Confirmed:\n2. THRUST LEVER — IDLE\n3. ENGINE SWITCH — OFF / STOP\n4. ENGINE ISOLATION push button — PUSH\nCheck associated CAS “ENGINE ISOLATED” after five sec. CONFIRM ASSOCIATED green “1” illuminated.\nNOTE: If possible, keep pitch and bank angles to within ±10° to achieve maximum extinguisher effectiveness.\nIF CAS Message remains, affected side:\n5. EXTINGUISHER push button — PUSH", "reference": "QRH 3-FIRE-01"}, {"id": "E-6", "title": "ENGINE HUNG START ON GROUND", "front": "Indications: Engine Fails to Accelerate for > 30 Seconds.", "back": "1. Engine Switch — OFF", "reference": "QRH 3A-NAA-08"}, {"id": "E-7", "title": "ENGINE HOT START ON GROUND", "front": "Indications for Hot Start: Rapidly rising ITT approaching engine limits of 1,000 °C or ITT hanging between 900 °C and 1,000 °C for 15 seconds.", "back": "1. Engine Switch — OFF", "reference": "QRH 3A-NAA-07"}, {"id": "E-8", "title": "SWPS INADVERTENT PUSHER OPERATION", "front": "Non-commanded pusher operation, rapid nose-down motion.", "back": "WARNING: NATURAL STALLS ARE NOT PREVENTED WITH THE STICK PUSHER INOPERATIVE. STALLS MUST BE AVOIDED WHEN THE STICK PUSHER IS INOPERATIVE.\n1. Control wheel — Hold against pusher action\n2. AP disconnect button — Press and hold continuously", "reference": "QRH 3A-NAA-18"}, {"id": "E-9", "title": "ENGINE FIRE ON GROUND / TAIL PIPE FIRE", "front": "If during start, engine fire detector senses a temperature above 510 °C or else engine fire is indicated by ground personnel.", "back": "1. THRUST LEVER — IDENTIFY/IDLE Affected Engine\n2. ENG SWITCH — OFF\n3. ENG ISOL pushbutton — Push/check after 5 sec amber ENG ISOL; Confirm green “1”\n4. FIRE XTING pushbutton — Push to activate", "reference": "QRH 3-NAE-05"}, {"id": "E-10", "title": "ENGINE FIRE OR FAILURE DURING TAKEOFF", "front": "ENGINE FIRE OR FAILURE DURING TAKEOFF", "back": "Airspeed below V1:\n1. Rejected Takeoff - 3-NAE-19 — Accomplish\n-END-\nAirspeed at or above V1:\n1. THRUST levers — Fully forward, ATR\n2. VR — Rotate to 9° ANU Initially\n3. Airspeed — Maintain at or above V2\n4. L/G — When positive rate of climb – UP", "reference": "QRH 3-NAE-06"}, {"id": "E-11", "title": "REJECTED TAKEOFF", "front": "REJECTED TAKEOFF", "back": "CAUTION: IF AUTOTHROTTLE WAS ENGAGED FOR TAKEOFF, ENSURE AUTOTHROTTLE IS DISCONNECTED BY EITHER PRESSING AN AT DISC PUSHBUTTON OR HOLDING THE THROTTLES AT IDLE FOR 2 TO 3 SECONDS UNTIL AUTOTHROTTLE DISCONNECTS.\n1. THRUST levers — IDLE\n2. BRAKES — Max Braking / As Required", "reference": "QRH 3-NAE-19"}, {"id": "E-12", "title": "EMERGENCY DESCENT", "front": "EMERGENCY DESCENT", "back": "1. Crew Oxygen Masks — DON / 100% / Establish COMM\n2. PASSENGER OXYGEN — ON, instruct passengers to don dropdown masks\n3. SEAT BELTS — ON\n4. THRUST Levers — IDLE\n5. AIRBRAKE lever — OUT", "reference": "QRH 3-NAE-02"}, {"id": "E-13", "title": "SMOKE, FIRE, OR FUMES IN COCKPIT / CABIN", "front": "SMOKE, FIRE, OR FUMES IN COCKPIT / CABIN", "back": "IMMEDIATE ACTION IF SMOKE AND / OR FUMES ARE PERCEPTIBLE:\n1. CREW OXYGEN MASK — DON / select EMGCY / Vent valve open\n2. Smoke Goggles — DON\n3. Passenger OXYGEN — ON, Instruct PAX to don dropdown masks\nLAND ASAP / INITIATE DIVERSION\n4. Aircraft — Land as soon as possible", "reference": "QRH 3-SMOKE-01"}, {"id": "E-14", "title": "EMERGENCY EVACUATION", "front": "EMERGENCY EVACUATION", "back": "1. PARK BRAKE — Set\n2. ATC / distress message — Notify\n3. ENG L+R switches — Both OFF", "reference": "QRH 3-EVAC-01"}, {"id": "E-15", "title": "TCAS RESOLUTION ADVISORY", "front": "Accompanied by audio commands for climb, descend, level off or maintain vertical speed.", "back": "1. Autopilot — Use yoke quick disconnect if AP engaged\n2. Aircraft attitude — Immediately comply with RA commands indicated on the PFD\n3. ATC — Inform of TCAS RA\nWhen clear of conflict:\n4. Aircraft — Return to previously assigned altitude and advise ATC", "reference": "QRH 3B-FAS-20"}, {"id": "E-16", "title": "RH ENGINE START", "front": "RH ENGINE START", "back": "RH Engine — Start\nTo start the RH Engine:\n1. R Engine switch rotate to RUN\n2. Confirm R Booster pump running and no FUEL PRESSURE CAS messages appear\n3. R START Press", "reference": "AFM 4-PF-06"}, {"id": "E-17", "title": "RH ENGINE START (CONTINUED)", "front": "RH ENGINE START (CONTINUED)", "back": "1. Monitor start sequence as follows:\n2. When pressing start button “START” will appear “ON” on the PFD\n3. At about 10% N2, “START” and “IGN” is illuminated in inverse video. Check N1 is increasing\n4. Observe light-up and engine parameters until “IDL” is reached\n5. Depending on ambient conditions “START” and “IGN” extinguish at approximately 45% - 50% of N2", "reference": "AFM 4-PF-06"}, {"id": "E-18", "title": "LH ENGINE START", "front": "LH ENGINE START", "back": "1. LH Engine — Start\n• Start LH Engine Accordingly\nNOTE: The right engine must exit QPM and set to Ground Idle before Left Engine start", "reference": "AFM 4-PF-06"}, {"id": "E-19", "title": "ENGINE APPROXIMATE GND IDLE VALUES", "front": "ENGINE APPROXIMATE GND IDLE VALUES", "back": "N1: 25%\nITT: 400 °C\nN2: Min 53.4%\nFF: 160-180 lb\nConfirm GEN 2 takes over and is supplying the aircraft.\nNOTE: If TAT or reported OAT is <10 °C and visible signs of moisture are present then set the IPS rotary switch to AUTO/NAI.", "reference": "AFM 4-PF-06"}, {"id": "E-20", "title": "AFCS ABNORMAL DISCONNECT", "front": "AFCS ABNORMAL DISCONNECT", "back": "Indication: Flashing red “AP” on PFD and continuous “Cavalry Charge” aural warning.\n1. Airplane control wheel — Grasp firmly and regain aircraft control\n2. Autopilot Disengage switch — Press to cancel aural warning (pilot or copilot wheel)\n3. Aircraft — Retrim manually as necessary\nIf no AFCS associated CAS messages:\n4. Aircraft — Attempt to re-engage autopilot once", "reference": "QRH 3A-NAA-01"}, {"id": "E-21", "title": "CLIMB", "front": "CLIMB", "back": "1. Gear — UP\n• Confirm Lever Up and Lights Out on System Summary Page\n2. Yaw Damper — ON\n• Confirm on FMA\n3. Flaps — UP\n• Confirm lever at 0 and indication on System Summary Page\n4. Thrust — MCT\n• Thrust Levers back to MCT gate within five min after setting T/O\n• Verify MCT indications on both engine PFD indications", "reference": "AFM 4-IF-01"}, {"id": "L-1", "title": "Maximum Operating Speed", "front": "1. VMO (≤ 28,230 ft) — ?\n2. MMO (≥ 28,230 ft) — ?", "back": "1. VMO — 290 KIAS\n2. MMO — 0.74 M\nNOTE\nMMO schedule for maximum speed above 28,230 ft at this location.", "reference": "AFM Page 2-1-9"}, {"id": "L-2", "title": "Weight Limits", "front": "1. Max Zero Fuel Weight (MSN 101-500) — ?\n2. Max Ramp Weight (MSN 101-500) — ?\n3. Max Zero Fuel Weight (MSN 501-UP) — ?\n4. Max Ramp Weight (MSN 501-UP) — ?", "back": "1. Max Zero Fuel Weight (MSN 101-500) — 14,220 lbs (6,450 kg)\n2. Max Ramp Weight (MSN 101-500) — 18,400 lbs (8,345 kg)\n3. Max Zero Fuel Weight (MSN 501-UP) — 14,660 lbs (6650 kg)\n4. Max Ramp Weight (MSN 501-UP) — 18,840 lbs (8545 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-3", "title": "Weight Limits", "front": "1. Max Takeoff Weight (MSN 101-500) — ?\n2. Max Landing Weight (MSN 101-500) — ?\n3. Max Takeoff Weight (MSN 501-UP) — ?\n4. Max Landing Weight (MSN 501-UP) — ?", "back": "1. Max Takeoff Weight (MSN 101-500) — 18,300 lbs (8,300 kg)\n2. Max Landing Weight (MSN 101-500) — 16,900 lbs (7,665 kg)\n3. Max Takeoff Weight (MSN 501-UP) — 18,740 lbs (8,500 kg)\n4. Max Landing Weight (MSN 501-UP) — 17,340 lbs (7,865 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-4", "title": "Weight Limits", "front": "1. Maximum Baggage Weight (Small Restraint Net) — ?\n2. Maximum Baggage Weight (Large Restraint Net) — ?\n3. Maximum Cargo Weight (MSN 101-500) — ?\n4. Maximum Cargo Weight (MSN 500-UP) — ?", "back": "1. Maximum Baggage Weight (Small Restraint Net) — 400 lbs (180 kg)\n2. Maximum Baggage Weight (Large Restraint Net) — 530 lbs (240 kg)\n3. Maximum Cargo Weight (MSN 101-500) — 2,500 lbs (1,134 kg)\n4. Maximum Cargo Weight (MSN 501-UP) — 2,940 lbs (1,334 kg)", "reference": "AFM Page 2-1-23"}, {"id": "L-5", "title": "Loading Limits", "front": "1. Maximum Floor Loading (Over Floor Panels) — ?\n2. Maximum Floor Loading (On Seat Rails) — ?", "back": "1. Maximum Floor Loading (Over Floor Panels) — 100 lbs/ft² (500 kg/m²)\n2. Maximum Floor Loading (On Seat Rails) — 670 lbs/ft (1,000 kg/m)", "reference": "AFM Page 2-1-23"}, {"id": "L-6", "title": "Load Factor Limits", "front": "1. Flaps Up — ?\n2. Flaps Down — ?", "back": "1. Flaps Up — +3.0g ; -1.2g\n2. Flaps Down — +2.0g ; -0.0g", "reference": "AFM Page 2-1-24"}, {"id": "L-7", "title": "Operating Altitude Limits", "front": "Maximum Operating Altitude — ?", "back": "Maximum Operating Altitude — 45,000 ft (13,716 m)", "reference": "AFM Page 2-1-26"}, {"id": "L-8", "title": "Outside Air Temperature Limits", "front": "1. Minimum OAT (Sea Level) — ?\n2. Maximum OAT (Sea Level) — ?", "back": "1. Minimum OAT (Sea Level) — -54 °C (-67 °F)\n2. Maximum OAT (Sea Level) — +50 °C (122 °F)", "reference": "AFM Page 2-1-26"}, {"id": "L-9", "title": "Passenger Seating Limits", "front": "The maximum number of passengers in the Executive Interior Cabin is _____ passengers, including optional fit for two additional infants at first seating row left and right sides.", "back": "The maximum number of passengers in the Executive Interior Cabin is 8 passengers, including optional fit for two additional infants at first seating row left and right sides.", "reference": "AFM Page 2-1-25"}, {"id": "L-10", "title": "Airport Limits", "front": "1. Maximum Runway Slope — ?\n2. Approved Takeoff/Landing Surfaces — ?\n3. Contaminated Paved Runways — ?\nWith Gravel Kit Installed:\nDry/Wet Dirt-Sand-Gravel — ?\nDry/Wet Grass — ?", "back": "1. Maximum Runway Slope — ±2%\n2. Approved Takeoff/Landing Surfaces — Dry and Wet Paved Runways\n3. Contaminated Paved Runways — *Per AFM Supplement 02442\nWith Gravel Kit Installed:\n• Dry/Wet Dirt-Sand-Gravel — Per AFM Supplement 02444\n• Dry/Wet Grass — Per AFM Supplement 02473", "reference": "AFM Page 2-1-1, 2-1-2"}, {"id": "L-11", "title": "Airport Limits", "front": "1. Maximum Tailwind Component for takeoff and landing — ?\n2. Minimum Pressure Altitude — ?\n3. Maximum Pressure Altitude Landing Field Elevation — ?", "back": "Maximum Tailwind Component for Takeoff and Landing — 10 kt\nMinimum Pressure Altitude — -1,000 ft MSL\nMaximum Pressure Altitude Landing Field Elevation — 10,000 ft MSL", "reference": "AFM Page 2-1-2"}, {"id": "L-12", "title": "Engines", "front": "1. Number of Engines — ?\n2. Engine Manufacturer / Model Number — ?", "back": "1. Number of Engines — 2\n2. Engine Manufacturer / Model Number — Williams International FJ44-4A QPM", "reference": "AFM Page 1-1-2"}, {"id": "L-13", "title": "Oil Quantity", "front": "Oil level must not be below the ________ indicator mark on the oil tank sight glass prior to flight.", "back": "Oil level must not be below the ADD indicator mark on the oil tank sight glass prior to flight.", "reference": "AFM Page 2-1-26"}, {"id": "L-14", "title": "Engine Thrust Settings (LB)", "front": "1. Normal Takeoff Thrust — ?\n2. Automatic Thrust Reserve — ?", "back": "1. Normal Takeoff Thrust — 3,420 lbs\n2. Automatic Thrust Reserve — 3,600 lbs", "reference": "AFM Page 1-1-2"}, {"id": "L-15", "title": "Starter Duty Cycle Limits (Seconds)", "front": "1. Start Attempt 1 — ?\n2. Dry Motor Run — ?\n3. Start Attempt 2 — ?", "back": "1. Start Attempt 1 — ON (Start) - 50 Sec., OFF - 1 Min.\n2. Dry Motor Run — ON (Start) - 50 Sec., OFF - 1 Min.\n3. Start Attempt 2 — ON (Start) - 50 Sec., OFF - 30 Min.\nNOTE\nAbort engine start where N1 fails to increase by 25% N2.", "reference": "AFM Page 2-1-31, 2-1-32"}, {"id": "L-16", "title": "Engine Starting Limits", "front": "1. Maximum Tailwind Component for Engine Start — ?\n2. Maximum Crosswind Component for Engine Start — ?", "back": "1. Max. Tailwind Component for Engine Start — 20 kt\n2. Max. Crosswind Component for Engine Start — 25 kt Tower Wind", "reference": "AFM Page 2-1-31"}, {"id": "L-17", "title": "Engine Starting Limits", "front": "1. Minimum Time Between Engine Starts — ?\n2. Maximum Time to Light-off for Engine Start — ?", "back": "1. Minimum Time Between Engine Starts — 60 Seconds\n2. Maximum Time to Light-off for Engine Start — 12 Seconds", "reference": "AFM Page 2-1-31"}, {"id": "L-18", "title": "Engine Starting Limits", "front": "1. Minimum Ni-Cad Battery Voltage for Engine Start — ?\n2. Minimum Li-Ion Battery Voltage for Engine Start — ?\n3. Minimum Oil Temperature for Engine Start — ?", "back": "1. Min. Ni-Cad Battery Voltage for Engine Start — 22.0 VDC (BAT 1); 23.5 VDC (BAT 2)\n2. Min. Li-Ion Battery Voltage for Engine Start — State of Charge (SOC) indicators of both batteries green\n3. Min. Oil Temperature for Engine Start — -40 °C", "reference": "AFM Page 2-1-16"}, {"id": "L-19", "title": "Post Start Oil Temperature Limitations", "front": "The minimum oil temp for N2 > __ % or QPM operation is __ °C.", "back": "The minimum oil temp for N2 > 80% or QPM operation is +10 °C.", "reference": "AFM Page 2-1-32"}, {"id": "L-20", "title": "QPM Operation — Engine Limits", "front": "Activation of QPM is permitted after at least two minutes of stabilized operation at ________ N2. After QPM termination, run engine at ground idle thrust for at least _____ before shutdown or increasing thrust.", "back": "Activation of QPM is permitted after at least two minutes of stabilized operation at Ground Idle N2. After QPM termination, run engine at ground idle thrust for at least 2 Minutes before shutdown or increasing thrust.", "reference": "AFM Page 2-1-36"}, {"id": "L-21", "title": "QPM Operation — Engine Limits", "front": "QPM operation is permitted provided the aircraft remains stationary with the ____ on. The thrust lever remains ____ during QPM operation. The maximum generator load while in QPM of ___ is not exceeded.", "back": "QPM operation is permitted provided the aircraft remains stationary with the Park Brake on. The thrust lever remains IDLE during QPM operation. The maximum generator load while in QPM of 250 A is not exceeded.", "reference": "AFM Page 2-1-36"}, {"id": "L-22", "title": "Engine Cooldown", "front": "Engine shut-down is permitted when the engine has been run at idle thrust for more than __.", "back": "Engine shut-down is permitted when the engine has been run at idle thrust for more than 2 minutes.\nNOTE\nIt is recommended that the engine bleed valve is closed during this time.", "reference": "AFM Page 2-1-36"}, {"id": "L-23", "title": "Fuel Quantity", "front": "1. Total quantity — ?\n2. Usable quantity — ?\n3. Maximum permissible imbalance — ?", "back": "1. Total quantity — 895 US gal/5,999.8 lbs (3,389 liter/2,721 kg)\n2. Usable quantity — 890 US gal/5,964 lbs (3,369 liter/2,705 kg)\n3. Maximum permissible imbalance — 49 US gal/330 lbs (189 liter/150 kg)", "reference": "AFM Page 2-1-18"}, {"id": "L-24", "title": "Fuel Temperature", "front": "1. Maximum fuel temperature — ?\n2. Minimum fuel temperature — ?", "back": "1. Maximum fuel temperature — 80 °C\n2. Minimum fuel temperature — -40 °C", "reference": "AFM Page 2-1-17"}, {"id": "L-25", "title": "Pressure Refueling", "front": "Maximum refueling pressure — ?", "back": "Maximum refueling pressure — 60 PSI", "reference": "AFM Page 2-1-19"}, {"id": "L-26", "title": "Fuel Miscellaneous", "front": "The electric fuel booster pumps and fuel crossfeed valve must be ___.", "back": "The electric fuel booster pumps and fuel crossfeed valve must be operative.", "reference": "AFM Page 2-1-17"}, {"id": "L-27", "title": "Fuel Grades", "front": "Approved Fuel Grades — ?", "back": "Approved Fuel Grades — Jet A, Jet A-1, JP-8, TS-1", "reference": "AFM Page 2-1-17"}, {"id": "L-28", "title": "Maximum Landing Gear Speed", "front": "1. VLO (Extend) — ?\n2. VLO (Retract) — ?\n3. VLO (Extend EGES) — ?\n4. VLE — ?", "back": "1. VLO (Extend) — The lower of 250 KIAS or 0.74 M\n2. VLO (Retract) — 200 KIAS\n3. VLO (Extend EGES) — 180* KIAS\n4. VLE — The lower of 250 KIAS or 0.74 M\nNOTE\n* QRH L/G Emergency Extension (3-NAE-13) requires airspeed 160 KIAS or less.", "reference": "AFM Page 2-1-10"}, {"id": "L-29", "title": "Tire Limits", "front": "Maximum Tire Speed — ?", "back": "Maximum Tire Speed — 165 kt groundspeed", "reference": "AFM Page 2-1-15"}, {"id": "L-30", "title": "Maximum Flap Extended Speed VFE", "front": "1. 8° — ?\n2. 15° — ?\n3. 33° — ?", "back": "1. 8° — 200 KIAS\n2. 15° — 200 KIAS\n3. 33° — 175 KIAS", "reference": "AFM Page 2-1-9"}, {"id": "L-31", "title": "Cabin Pressurization Limits", "front": "1. Maximum Positive Cabin Pressure Differential — ?\n2. Maximum Negative Cabin Pressure Differential — ?\n3. Maximum Pressure Differential for Takeoff & Landing — ?", "back": "1. Maximum Positive Cabin Pressure Differential — 9.27 psid\n2. Maximum Negative Cabin Pressure Differential — -0.3 psid\n3. Maximum Pressure Differential for Takeoff & Landing — 0.7 psid", "reference": "AFM Page 2-1-15"}, {"id": "L-32", "title": "Airstair Limit", "front": "Persons allowed to be on the forward airstair (forward cabin door) at any time — ?", "back": "Persons allowed to be on the forward airstair (forward cabin door) at any time — 1 Person", "reference": "AFM Page 2-1-16"}, {"id": "L-33", "title": "Emergency Exit Limit", "front": "Each internal emergency exit overnight security pin, if installed, must be ___ and ___ before flight.", "back": "Each internal emergency exit overnight security pin, if installed, must be removed and stowed before flight.", "reference": "AFM Page 2-1-16"}, {"id": "L-34", "title": "GPU Limits", "front": "Prior to connecting a GPU, ensure GPU voltage is greater than ___ voltage.", "back": "Prior to connecting a GPU, ensure GPU voltage is greater than battery voltage.", "reference": "AFM Page 2-1-17"}, {"id": "L-35", "title": "GPU Limits", "front": "1. Voltage — ?\n2. Load Capacity (Initial Start Surge) — ?\n3. Load Capacity (Continuous) — ?", "back": "1. Voltage — 25.0 - 29.5 VDC\n2. Load Capacity (Initial Start Surge) — 1,200 A\n3. Load Capacity (Continuous) — 450 A", "reference": "AFM Page 2-1-16"}, {"id": "L-36", "title": "GPU Limits", "front": "1. Minimum Volts for Start — ?\n2. Minimum Volts to Charge Batteries — ?\n3. Maximum Volts to Charge Batteries — ?\n4. Minimum OAT for GPU Start — ?", "back": "1. Minimum Volts for Start — 24.0 VDC\n2. Minimum Volts to Charge Batteries — 28.0 VDC\n3. Maximum Volts to Charge Batteries — 29.5 VDC\n4. Minimum OAT for GPU Start — -54 °C", "reference": "AFM Page 2-1-16, 2-1-17"}, {"id": "L-37", "title": "Generator Limits", "front": "1. QPM — ?\n2. Ground Idle and Above — ?\n3. Flight — ?\n4. Maximum Voltage — ?", "back": "1. QPM — 250 A\n2. Ground Idle and Above — 400 A\n3. Flight — 400 A\n4. Maximum Voltage — 29.5 VDC", "reference": "AFM Page 2-1-16"}, {"id": "L-38", "title": "Battery Limits", "front": "1. Minimum Battery Temperature for Flight — ?\n2. Minimum Ni-Cd Battery Temperature — ?\n3. Minimum Li-Ion Battery Temperature — ?\n4. Minimum Ni-Cd Battery Volts for Start — ?\n5. Minimum Li-Ion Battery Volts for Start — ?\n6. Maximum Battery Charge Rate Before Takeoff — ?", "back": "1. Minimum Battery Temperature for Flight — 0 °C\n2. Minimum Ni-Cd Battery Temperature — -20 °C\n3. Minimum Li-Ion Battery Temperature — -5 °C\n4. Minimum Ni-Cd Battery Volts for Start — 22.0 VDC (Battery 1); 23.5 VDC (Battery 2)\n5. Min Li-Ion Battery Volts for Start — SOC Indicator on Both Batteries Green\n6. Maximum Battery Charge Rate Before Takeoff — Battery 1+2 must be <50 A and decreasing", "reference": "AFM Page 2-1-16"}, {"id": "L-39", "title": "Autopilot Limits", "front": "During autopilot operation, a pilot must be ___ in a pilot position with their ___ fastened.", "back": "During autopilot operation, a pilot must be seated in a pilot position with their seat belt fastened.", "reference": "AFM Page 2-1-3"}, {"id": "L-40", "title": "Autopilot Limits", "front": "The autopilot (AP) and yaw damper (YD) must be ___ during takeoff and landing.", "back": "The autopilot (AP) and yaw damper (YD) must be OFF during takeoff and landing.", "reference": "AFM Page 2-1-3"}, {"id": "L-41", "title": "Minimum A/P, Y/D, & A/T Altitudes", "front": "1. All operations except approach, A/P disengage by — ?\n2. Non-Precision, Circling, and Visual Approaches (a/s <150 KIAS & VS <1,500 ft/min) — ?\n3. Approaches in VGP mode — ?\n4. Coupled ILS approaches with G/S < 4.5° — ?", "back": "1. All operations except approach, A/P disengage by — 1,000 ft AGL\n2. Non-Precision, Circling, and Visual Approaches (a/s <150 KIAS & VS <1,500 ft/min) — 400 ft AGL\n3. Approaches in VGP mode — 200 ft AGL\n4. Coupled ILS approaches with G/S < 4.5° — 200 ft AGL", "reference": "AFM Page 2-1-3"}, {"id": "L-42", "title": "Yaw Damper Limits", "front": "Operation above ___ is prohibited with the Yaw Damper disengaged.", "back": "Operation above 30,000 feet MSL is prohibited with the Yaw Damper disengaged.", "reference": "AFM Page 2-1-3"}, {"id": "L-43", "title": "Severe Icing Conditions", "front": "Flight in freezing rain, freezing drizzle, or mixed icing conditions (supercooled liquid water and ice crystals) may result in ice build-up on protected surfaces exceeding the capability of the ___ ____ system, or may result in ice forming aft of the protected surfaces.", "back": "Flight in freezing rain, freezing drizzle, or mixed icing conditions (supercooled liquid water and ice crystals) may result in ice build-up on protected surfaces exceeding the capability of the Ice Protection system, or may result in ice forming aft of the protected surfaces.", "reference": "AFM Page 2-1-21"}, {"id": "L-44", "title": "Autopilot Usage in Icing Conditions", "front": "Care must be taken when using the autopilot that tactile cues, such as increased aileron forces, could potentially be masked by the autopilot function. Periodically ___ the autopilot to check for abnormal forces.", "back": "Care must be taken when using the autopilot that tactile cues, such as increased aileron forces, could potentially be masked by the autopilot function. Periodically disengage the autopilot to check for abnormal forces.", "reference": "AFM Page 2-1-21"}, {"id": "L-45", "title": "Nacelle Anti-Ice", "front": "The Nacelle Anti-ice (NAI) must be on for all ground operations, takeoff, and landing when:", "back": "The Nacelle Anti-ice (NAI) must be on for all ground operations, takeoff, and landing when:\n1. Visible moisture (i.e. standing water, slush, snow on taxi ways / runway) and indicated SAT or reported OAT <10 °C or\n2. Ice or other frozen precipitation is observed adhering to any part of the engine inlet.", "reference": "AFM Page 2-1-37"}, {"id": "L-46", "title": "Nacelle Anti-Ice", "front": "The NAI must be on for climb, cruise, and descent when:", "back": "The NAI must be on for climb, cruise, and descent when:\n1. In visible moisture with TAT <10 °C, or\n2. Flight through ice crystals, or\n3. Anytime ice accumulation is observed on the airframe", "reference": "AFM Page 2-1-37"}, {"id": "L-47", "title": "Nacelle Anti-Ice", "front": "Do not operate the NAI when the TAT is ___ °C. Do not operate the NAI during ___ operation. When required for takeoff, NAI must be selected ON prior to setting ___.", "back": "Do not operate the NAI when the TAT is >10 °C. Do not operate the NAI during QPM operation. When required for takeoff, NAI must be selected ON prior to setting takeoff power.", "reference": "AFM Page 2-1-37"}, {"id": "L-48", "title": "Horizontal Stabilizer De-Ice (HSDI)", "front": "Operation of the HSDI is not recommended when TAT < ___ unless required due to the presence of icing conditions.\nIf operated at TAT ≤ -40 °C, a ___ must be performed before takeoff.", "back": "Operation of the HSDI is not recommended when TAT < -40 °C unless required due to the presence of icing conditions.\nIf operated at TAT ≤ -40 °C, a visual inspection of the pneumatic boots and a system functional test must be performed before takeoff.", "reference": "AFM Page 2-1-19"}, {"id": "L-49", "title": "Oxygen System Limits", "front": "1. Minimum oxygen quantity for dispatch — ?\n2. Minimum oxygen supply for each occupant for pressurized flight above 25,000 feet MSL — ?", "back": "1. Minimum oxygen quantity for dispatch — 680 Liters\n2. Minimum oxygen supply for each occupant for pressurized flight above 25,000 feet MSL — 10 minutes", "reference": "AFM Page 2-1-28"}, {"id": "L-50", "title": "Electronic Charts", "front": "Pilots are responsible for taxiing by ___ and for flying by airborne navigation with use of ___.", "back": "Pilots are responsible for taxiing by external visual references and for flying by airborne navigation with use of primary navigation instruments.", "reference": "AFM Page 2-1-7"}, {"id": "L-51", "title": "Electronic Charts", "front": "Position accuracy of a chart aircraft symbol can decrease in the case of insufficient ___ or ____. The aircraft symbol is not in-scale with ACE™ Electronic Charts.", "back": "Position accuracy of a chart aircraft symbol can decrease in the case of insufficient GPS signal reception or GPS sensor failure. The aircraft symbol is not in-scale with ACE™ Electronic Charts.", "reference": "AFM Page 2-1-7"}, {"id": "L-52", "title": "Electronic Charts", "front": "ACE™ Electronic Charts do not replace approved ____ or approved ____.", "back": "ACE™ Electronic Charts do not replace approved published papers or approved electronic systems for aeronautical charts.", "reference": "AFM Page 2-1-7"}, {"id": "L-53", "title": "Weather Radar", "front": "Operation of the weather radar is prohibited:", "back": "Operation of the weather radar is prohibited:\n1. Within a hangar or other enclosure\n2. During airplane refueling/defueling operations\n3. With personnel present within the acceptable safe distance and ± 60° from the aircraft nose", "reference": "AFM Page 2-1-8"}, {"id": "L-54", "title": "INAV Map", "front": "1. The INAV topographical map shall not be used for primary ___.\n2. The display of airspace shall not be used as the ___.", "back": "1. The INAV topographical map shall not be used for primary navigation.\n2. The display of airspace shall not be used as the sole airspace reference.", "reference": "AFM Page 2-1-8"}, {"id": "L-55", "title": "Smart View (SV)", "front": "Operations using Smart View are permitted when it is not used as a ___ of navigation reference or a ___ reference for obstacle clearance.", "back": "Operations using Smart View are permitted when it is not used as a primary source of navigation reference or a primary reference for obstacle clearance.", "reference": "AFM Page 2-1-8"}, {"id": "L-56", "title": "Vertical Situation Display", "front": "Use of the vertical situation display is permitted provided it is not used as a ___ of navigation.", "back": "Use of the vertical situation display is permitted provided it is not used as a primary source of navigation.", "reference": "AFM Page 2-1-8"}, {"id": "L-57", "title": "FMS", "front": "Accomplishment of ___ approach types using the FMS is prohibited.", "back": "Accomplishment of ILS, LOC, LOC-BC, LDA, SDF and MLS approach types using the FMS is prohibited.", "reference": "AFM Page 2-1-4"}, {"id": "AGI-1", "title": "Display Unit (DU) Color Conventions — Red", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nRED — ?", "back": "Warning Conditions, Warning CAS Messages; Flight Envelope and System Limitations, Invalid Primary Instruments", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-2", "title": "Display Unit (DU) Color Conventions — Amber", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nAMBER — ?", "back": "Caution Conditions, Caution CAS Messages; Invalid Data, Miscompare Annunciation", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-3", "title": "Display Unit (DU) Color Conventions — Magenta", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nMAGENTA — ?", "back": "FD Coupled Data, Active Route/Flight Plan, Flight Director Cue", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-4", "title": "Display Unit (DU) Color Conventions — Cyan", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nCYAN — ?", "back": "Advisory CAS Messages; Crew selected Data; Window with focus or cursor, curled arrow Prompts; FMS pending Flight Plan", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-5", "title": "Display Unit (DU) Color Conventions — Green", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nGREEN — ?", "back": "Autopilot Engaged Modes; Current Data; ON or Functioning", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-6", "title": "Display Unit (DU) Color Conventions — White", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nWHITE — ?", "back": "Armed/Standby Modes; Status Data; Scales and Associated Figures, Labels; Informational CAS Messages; Joystick Cross-Pointer Cursor, Active Flight Plan Waypoints", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-7", "title": "Display Unit (DU) Color Conventions — Gray", "front": "DISPLAY UNIT (DU) COLOR CONVENTIONS\n\nGRAY — ?", "back": "Legends, Symbols or Units, Boxes (limits for displaying information); Aircraft Structures", "reference": "Honeywell Pilot's Guide"}, {"id": "AGI-8", "title": "Dimensions", "front": "DIMENSIONS\n\n1. Total Length (Nose to Tail) — ?\n2. Total Height (At Tail) — ?\n3. Wingspan — ?", "back": "1. Total Length (Nose to Tail) — 55 ft. 2 in. (16.8 m)\n2. Total Height (At Tail) — 17 ft. 4 in. (5.3 m)\n3. Wingspan — 55 ft. 9 in. (17 m)", "reference": "AFM Page 1-1-3"}, {"id": "AGI-9", "title": "Engine Danger Areas", "front": "ENGINE DANGER AREAS\n\n1. Radius Forward of Engines — ?\n2. Engine Start — ?\n3. Engine Max Thrust — ?", "back": "1. Radius Forward of Engines — 20 ft (6.1 m)\n2. Engine Start — 60 ft (18.3 m) x 36.7 ft (11.2 m) aft of engine\n3. Engine Max Thrust — 286 ft (87.2 m) x 125.7 ft (38.3 m) aft of engine", "reference": "AFM Page 1-1-5"}, {"id": "AFM-1", "title": "Weight Limits — Our Aircraft (MSN 631)", "front": "For MSN 631, state all five weight limits:\n1. Max Ramp Weight — ?\n2. Max Takeoff Weight — ?\n3. Max Landing Weight — ?\n4. Max Zero Fuel Weight — ?\n5. Max Cargo Weight — ?", "back": "MSN 631 is in the MSN 501-up column:\n1. Max Ramp Weight — 18,840 lb (8,545 kg)\n2. Max Takeoff Weight — 18,740 lb (8,500 kg)\n3. Max Landing Weight — 17,340 lb (7,865 kg)\n4. Max Zero Fuel Weight — 14,660 lb (6,650 kg)\n5. Max Cargo Weight — 2,940 lb (1,334 kg)\nNOTE: These are the higher values. The 101-500 figures are each 440 lb lower (except baggage/floor limits, which are common to all serials).", "reference": "AFM Table 2-1-15 (p 2-1-23)", "topic": "MSN 631"}, {"id": "AFM-2", "title": "CG Limits — Our Aircraft (MSN 631)", "front": "For MSN 631, state the forward and aft CG limits (% MAC) at:\n1. 18,840 lb (Max Ramp Weight) — ?\n2. 18,740 lb (MTOW) — ?\n3. 13,560 lb — aft limit ?\n4. 11,510 lb — forward limit ?", "back": "1. 18,840 lb (MRW) — fwd 25.0% / aft 39.8% MAC\n2. 18,740 lb (MTOW) — fwd 25.0% / aft 40.0% MAC\n3. 13,560 lb (6,150 kg) — aft limit 47.6% MAC\n4. 11,510 lb (5,221 kg) — fwd limit 37.0% MAC\nNOTE: Straight-line variation between points. Datum is 146.1 in (3,711 mm) forward of the forward jacking point.", "reference": "AFM Table 2-1-16 (p 2-1-24)", "topic": "MSN 631"}, {"id": "AFM-3", "title": "VO — Maximum Operating Maneuvering Speed", "front": "Do not make full or abrupt control movements above VO.\nState VO for MSN 501-up MTOW, and the schedule down to minimum weight.", "back": "18,740 lb (8,500 kg) MTOW MSN 501-up — 170 KIAS\n18,300 lb (8,300 kg) MTOW MSN 101-500 — 170 KIAS\n17,650 lb (8,005 kg) — 165 KIAS\n17,000 lb (7,711 kg) — 160 KIAS\n16,000 lb (7,258 kg) — 155 KIAS\n15,000 lb (6,804 kg) — 150 KIAS\n14,000 lb (6,350 kg) — 145 KIAS\n13,000 lb (5,897 kg) — 140 KIAS\n12,000 lb (5,443 kg) — 135 KIAS\n11,440 lb (5,190 kg) — 120 KIAS\nNOTE: Avoid rapid, large alternating control inputs — especially combined with large pitch/roll/yaw changes — as these may cause structural failure at ANY speed, including below VO.", "reference": "AFM Table 2-1-5 (p 2-1-9), 19.3 (p 2-1-24)", "topic": "Airspeeds"}, {"id": "AFM-4", "title": "VO RUDDER — Rudder Maneuvering Limits", "front": "1. Full/abrupt rudder input limit up to 20,000 ft — ?\n2. Full/abrupt rudder input limit above 20,000 ft — ?\n3. Speed above which pedal travel is limited to 1/3 — ?\n4. Speed above which pedal travel is limited to 1/10 — ?", "back": "1. Up to 20,000 ft (6,096 m) — 130 KIAS\n2. Above 20,000 ft (6,096 m) — 125 KIAS\n3. 185 KIAS (SL to 45,000 ft) — do not exceed 1/3 of pedal travel\n4. 290 KIAS (SL to 45,000 ft) — do not exceed 1/10 of pedal travel", "reference": "AFM Table 2-1-6 (p 2-1-9)", "topic": "Airspeeds"}, {"id": "AFM-5", "title": "VMCG — Minimum Control Speed on Ground", "front": "VMCG (flaps 8° / 15°) — ?", "back": "VMCG — 87 KIAS (flaps 8° / 15°)", "reference": "AFM Table 2-1-10 (p 2-1-10)", "topic": "Airspeeds"}, {"id": "AFM-6", "title": "VMC — Minimum Control Speed for Takeoff", "front": "State VMC by weight for flaps 15° and flaps 8°.", "back": "Flaps 15°:\n  ≥13,228 lb (6,000 kg) — 77 KIAS\n  >12,125 lb (5,500 kg) — 81 KIAS\n  >11,023 lb (5,000 kg) — 84 KIAS\nFlaps 8°:\n  ≥13,669 lb (6,200 kg) — 82 KIAS\n  >12,125 lb (5,500 kg) — 87 KIAS\n  >11,023 lb (5,000 kg) — 90 KIAS\nNOTE: Flight testing determined the PC-24 has NO critical engine for VMC purposes.", "reference": "AFM Table 2-1-11 (p 2-1-10)", "topic": "Airspeeds"}, {"id": "AFM-7", "title": "VMCL — Minimum Control Speed for Landing", "front": "State VMCL by weight for flaps 15° and flaps 33°.", "back": "Flaps 15°:\n  ≥13,007 lb (5,900 kg) — 78 KIAS\n  >12,125 lb (5,500 kg) — 81 KIAS\n  >11,023 lb (5,000 kg) — 84 KIAS\nFlaps 33°:\n  ≥13,228 lb (6,000 kg) — 73 KIAS\n  >12,125 lb (5,500 kg) — 77 KIAS\n  >11,023 lb (5,000 kg) — 80 KIAS\nNOTE: No critical engine for VMC purposes.", "reference": "AFM Table 2-1-12 (p 2-1-10)", "topic": "Airspeeds"}, {"id": "AFM-8", "title": "Airspeed Tape Markings (PFD / ESIS)", "front": "Identify each airspeed tape marking and its value:\n1. Red/white barber pole — ?\n2. Placard \"G\" — ?\n3. Placard \"Gr\" — ?\n4. Placards \"08\" / \"15\" — ?\n5. Placard \"33\" — ?\n6. Red low-speed tape — ?", "back": "1. Barber pole (across and upward, right side of tape) — the lower of 290 KIAS or 0.74 M (VMO / MMO)\n2. \"G\" — 250 KIAS, VLO Extend (max landing gear operating speed, extend)\n3. \"Gr\" — 200 KIAS, VLO Retract\n4. \"08\" / \"15\" — 200 KIAS, VFE at flaps 8° / 15°\n5. \"33\" — 175 KIAS, VFE at flaps 33°\n6. Red low speed awareness tape — extends up from the bottom of the tape to shaker speed\nNOTE: The red high-speed strip extends down from VMO/MMO to the valid VLO or VFE; it is not shown in clean configuration or with gear extended only.", "reference": "AFM Table 2-1-13 (p 2-1-11)", "topic": "Airspeeds"}, {"id": "AFM-9", "title": "AFCS — Minimum Engagement Heights After Takeoff", "front": "1. Minimum autopilot engagement height after takeoff — ?\n2. Minimum yaw damper engagement height after takeoff — ?\n3. What must be done before YD engagement — ?", "back": "1. Autopilot — 400 ft AGL\n2. Yaw damper — 50 ft AGL\n3. The landing gear must be selected UP prior to YD engagement", "reference": "AFM 4.2.2 (p 2-1-3)", "topic": "AFCS"}, {"id": "AFM-10", "title": "AFCS — General Prohibitions and Overrides", "front": "State the AFCS general limitations: override, tactile feedback, quick disconnect, TCS, and the yaw-damper altitude limit.", "back": "• Do NOT override the autopilot or yaw damper\n• Do NOT engage the autopilot while the tactile feedback system is active\n• The pilot-side quick disconnect button must be operable before departure\n• Servos may be temporarily disengaged without disengaging the AP by pushing and holding the TCS switch on the control wheel for the desired duration\n• Flight above 30,000 ft MSL with the yaw damper disengaged is PROHIBITED\n• During AP operation a qualified pilot must be seated in a pilot position with seat belt fastened", "reference": "AFM 4.2.1 (p 2-1-3)", "topic": "AFCS"}, {"id": "AFM-11", "title": "Autothrottle — Override and Approved Phases", "front": "1. How is the autothrottle intentionally overridden — ?\n2. In which phases of flight may the autothrottle be used — ?", "back": "1. Reposition and HOLD the thrust lever for a minimum of 3 seconds. This causes an AT disconnect and aural warning, cancelled with the AT quick disconnect button on the power control lever.\n2. Takeoff, climb, cruise, descent and approach.", "reference": "AFM 4.2.1 (p 2-1-3)", "topic": "AFCS"}, {"id": "AFM-12", "title": "TCAS II — Aural Inhibit and OEI", "front": "1. RA and TA aural messages are inhibited below what radio altitude during ascent — ?\n2. ...and during descent — ?\n3. With one engine inoperative, which TCAS mode is selected — ?\n4. May the pilot deviate from an ATC clearance to comply with an RA — ?", "back": "1. Ascent — inhibited below 1,100 ft radio altitude\n2. Descent — inhibited below 900 ft radio altitude\n3. One engine inoperative — select TA ONLY\n4. Yes — the pilot is authorized to deviate from ATC to the extent necessary to comply with an RA. Prompt return to the ATC cleared altitude when \"CLEAR OF CONFLICT\" is announced.\nNOTE: Do not maneuver on a TA alone — TA information is only an aid to visual acquisition.", "reference": "AFM 4.5 (p 2-1-7)", "topic": "AFCS"}, {"id": "AFM-13", "title": "Engine Operating Limits — Thrust, N1, N2, ITT", "front": "State thrust, N1, N2 and ITT limits with time limits for:\n1. Normal Takeoff — ?\n2. ATR — ?\n3. Max Continuous / Climb — ?", "back": "1. Normal Takeoff — 3,420 lb · N1 104.7% · N2 100.8% · ITT 855 °C · max 5 min\n2. ATR — 3,600 lb · N1 104.7% · N2 100.8% · ITT 855 °C · max 10 min with OEI, otherwise 5 min\n3. Max Continuous / Climb — N1 104.7% · N2 100.8% · ITT 835 °C\nOil for all three: PRESS 40-120 psi · TEMP 10-135 °C\nExcept in an emergency, selecting thrust greater than NTO is PROHIBITED.\nIf ATR Disarm CAS is shown, do not attempt takeoff if performance was calculated with ATR available.", "reference": "AFM Table 2-1-18 (p 2-1-29), 24.1 (p 2-1-28)", "topic": "Powerplant"}, {"id": "AFM-14", "title": "Engine Transient Limits", "front": "State the transient (short-duration) limits:\n1. N1 — ?\n2. N2 — ?\n3. ITT — ?\n4. Oil pressure high / low — ?\n5. Oil temperature — ?", "back": "1. N1 — 105.7% (2 min)\n2. N2 — 101.5% (2 min)\n3. ITT — 855 °C (0 sec)\n4. Oil pressure — 130 psi high (max 5 min); 23 psi transient low\n5. Oil temperature — 149 °C (when operating below 80% N2 for up to 5 min)", "reference": "AFM Table 2-1-18 (p 2-1-29)", "topic": "Powerplant"}, {"id": "AFM-15", "title": "Oil Pressure and Temperature Limits", "front": "1. Minimum oil pressure at or above 80% N2 — ?\n2. Minimum oil pressure below 80% N2 — ?\n3. Maximum allowable oil pressure — ?\n4. Oil temp range at ground/flight idle — ?\n5. QPM oil pressure range — ?", "back": "1. At or above 80% N2 — 40 psig minimum\n2. Below 80% N2 — 30 psig minimum\n3. 130 psig maximum, for 5 minutes maximum\n4. Ground or Flight Idle (continuous) — oil temp -40 to 135 °C; oil press 30 min / 120 max\n5. QPM — oil press 30-120 psi, oil temp 10-135 °C, N1 45.4%\nNOTE: Elevated oil pressure is typically observed when oil temperature is cold.", "reference": "AFM Table 2-1-18 (p 2-1-29)", "topic": "Powerplant"}, {"id": "AFM-16", "title": "Zero and Negative G Limit", "front": "The engine is limited to how long at zero and/or negative G, and what indication is acceptable during that time?", "back": "10 seconds of continuous flight at zero and/or negative G.\nDuring this time it is acceptable for engine OIL PRESSURE to indicate ZERO.\nExceeding the limit may cause engine damage from oil starvation.", "reference": "AFM 24.1 (p 2-1-28)", "topic": "Powerplant"}, {"id": "AFM-17", "title": "Oil Quantity and Consumption", "front": "1. Oil tank total volume — ?\n2. Oil tank fill volume — ?\n3. Oil tank usable volume — ?\n4. Maximum permissible oil consumption rate — ?\n5. Minimum level before flight — ?", "back": "1. Total volume — 5.85 qt\n2. Fill volume — 5.65 qt\n3. Usable volume — 4.32 qt\n4. Max consumption — 0.032 gal/hr (0.128 qt/hr)\n5. Oil level must not be below the ADD indicator mark on the sight glass\nApproved oils: Mobil Jet II (preferred) and Mobil 254, both MIL-L-23699. Mixing approved oils when topping off is permitted.", "reference": "AFM 20.1, 20.2 (p 2-1-25, 2-1-26)", "topic": "Powerplant"}, {"id": "AFM-18", "title": "High Tailwind — N1 Restriction", "front": "When the tailwind component is greater than 10 kt, what N1 restriction applies?", "back": "CAUTION: When the tailwind component is greater than 10 kt, do NOT exceed 60% N1 until the aircraft rolling speed is greater than the tailwind component.\nNOTE: Higher minimum throttle-up speeds up to 60% N1 may be required if the tailwind component exceeds 10 kt.", "reference": "AFM 24.1 (p 2-1-28), Table 2-1-19 footnote (p 2-1-31)", "topic": "Powerplant"}, {"id": "AFM-19", "title": "Dry Motor Run — Duty Cycle Exception", "front": "An engine emergency or abnormal procedure calls for a Dry Motor Run. Do the 1-minute and 30-minute starter cooling waits apply?", "back": "CAUTION: If any engine related emergency or abnormal procedure requires a Dry Motor Run, the Dry Motor Run may be performed WITHOUT DELAY.\nThere is NO requirement to wait 1 minute (after the first start attempt) or 30 minutes (after the second start attempt) before initiating the Dry Motor Run.\nAbort engine start where N1 fails to increase by 25% N2.\nProvided the table wait times are met, an indefinite number of start attempts is permitted.", "reference": "AFM 24.2.2, Table 2-1-19 (p 2-1-31, 2-1-32)", "topic": "Powerplant"}, {"id": "AFM-20", "title": "Before Left Engine Start — Doors", "front": "What must be confirmed about the doors before left engine start?", "back": "The main passenger door and the cargo door must be CLOSED and SECURED before left engine start.", "reference": "AFM 24.2.1 (p 2-1-31)", "topic": "Powerplant"}, {"id": "AFM-21", "title": "Freezing Fog — Engine Limitation", "front": "Engine operation in freezing fog is prohibited below what temperature?", "back": "Do NOT operate the engines in freezing fog conditions below -15 °C.", "reference": "AFM 24.7.2 (p 2-1-37)", "topic": "Powerplant"}, {"id": "AFM-22", "title": "QPM — Complete Prerequisite Gate List", "front": "List every condition that must be satisfied before activating Quiet Power Mode.", "back": "ALL of the following must be true:\n1. Aircraft stationary with PARK BRAKE ON\n2. Ground icing conditions are NOT present\n3. NOT (visible moisture present AND TAT less than 10 °C)\n4. Crosswind / tailwind less than 20 kt (average)\n5. Only the RIGHT engine is to be operated in QPM\n6. A flight crew member seated at the controls with lap belt fastened\n7. Aircraft at Ground Idle N2, stabilized, for at least 2 min\nDuring QPM: thrust lever at IDLE · generator load ≤250 A · NAI must NOT be operated · right engine must exit QPM and be set to Ground Idle before left engine start.\nAfter QPM termination: acceleration or shutdown only after ≥2 min at Ground Idle.", "reference": "AFM 24.6, Fig. 2-1-8 (p 2-1-36)", "topic": "Powerplant"}, {"id": "AFM-23", "title": "Engine Fire Protection — Dispatch", "front": "May the aircraft be operated with one engine fire protection system inoperative?", "back": "No. Do NOT operate the aircraft system if the left or right fire protection system is inoperative.", "reference": "AFM 24.4 (p 2-1-36)", "topic": "Powerplant"}, {"id": "AFM-24", "title": "Minimum Airspeed — Flaps Retracted in Icing", "front": "The minimum airspeed with flaps retracted in icing conditions — ?", "back": "Minimum airspeed, flaps retracted, in icing conditions — 150 KIAS", "reference": "AFM 16.3 (p 2-1-21)", "topic": "Icing"}, {"id": "AFM-25", "title": "Wing Anti-Ice (WAI) — Inhibit and Limits", "front": "1. WAI is inhibited under what two conditions — ?\n2. Above what TAT must WAI not be operated — ?", "back": "1. WAI is inhibited when: TAT >15 °C, or the aircraft is on the ground.\n2. Do NOT operate WAI with a TAT of more than 10 °C, unless required by the presence of icing conditions.", "reference": "AFM 15.2 (p 2-1-20)", "topic": "Icing"}, {"id": "AFM-26", "title": "Windshield Emergency Heat — Limits", "front": "When must windshield emergency heating not be operated?", "back": "Do NOT operate windshield EMERGENCY heating on the ground, or when TAT is >10 °C.", "reference": "AFM 15.3 (p 2-1-20)", "topic": "Icing"}, {"id": "AFM-27", "title": "Flaps in Icing Conditions", "front": "1. Maximum flap extension in icing — ?\n2. Flap setting for approach and landing in active icing — ?\n3. Retraction limit with ice on the lifting surfaces — ?", "back": "1. Do NOT extend the flaps beyond 15° in icing conditions.\n2. Use FLAPS 15 for approach and landing in current icing conditions (ice detectors indicating ICE or pilot assessment). Do NOT use Flaps 33 for landing in current, active icing conditions.\n3. Do NOT retract the flaps below 8° if signs of ice are present on the lifting surfaces.\nMinimum airspeed with flaps retracted in icing — 150 KIAS.", "reference": "AFM 16.3 (p 2-1-21)", "topic": "Icing"}, {"id": "AFM-28", "title": "Severe Icing — Visual Cues and Autopilot", "front": "1. Name the two visual cues that require you to immediately exit icing.\n2. What is the autopilot limitation in severe icing — ?", "back": "1. Immediately exit icing conditions if either cue exists:\n  • Unusual, extensive ice accumulation on the airframe or on the cockpit SIDE WINDOWS\n  • Excessive accumulation of ice BEYOND the wing protected leading edge\n2. Do NOT engage the autopilot in severe icing conditions. When the AP is used in icing, periodically disengage it to check for abnormal forces — tactile cues such as increased aileron force can be masked by the autopilot.", "reference": "AFM 16.4, 16.5 (p 2-1-21)", "topic": "Icing"}, {"id": "AFM-29", "title": "Icing — Wing Check, Holding, and SWPS Override", "front": "1. What must the pilot periodically check while flying in icing — ?\n2. What holding restriction applies in icing — ?\n3. When must the SWPS ICE OVRD not be used — ?", "back": "1. WARNING: THE PILOT SHALL PERIODICALLY CHECK THE LEFT WING UPPER SURFACE ON A REGULAR BASIS WHILE FLYING IN ICING CONDITIONS TO ENSURE THERE IS NO UNUSUAL ICE ACCUMULATION.\n2. Extended holding in icing conditions on a SINGLE BLEED SOURCE is not allowed.\n3. Do NOT operate the SWPS ICE OVRD push button / SWPS ICE MODE rotary selector if there are signs of ice on the wings.", "reference": "AFM 16, 16.2, 16.6 (p 2-1-20, 2-1-21)", "topic": "Icing"}, {"id": "AFM-30", "title": "Takeoff with Contamination / Freezing Precipitation", "front": "1. What inspection is required before takeoff if contamination is suspected — ?\n2. What must you do on encountering freezing rain or freezing drizzle — ?\n3. May you operate into an airport reporting freezing rain — ?", "back": "1. Do NOT take off if there are signs of ice, snow or frost on the lifting surfaces. A VISUAL AND TACTILE inspection of the wing leading edge and upper wing surface must be conducted.\n2. Immediately EXIT the freezing rain or freezing drizzle by changing altitude or course.\n3. No. Do NOT operate into airports reporting freezing rain or freezing drizzle.\nApproved fluids: AMS 1424/1 Type I and AMS 1428/1 Types II, III and IV.", "reference": "AFM 16, 16.1 (p 2-1-20)", "topic": "Icing"}, {"id": "AFM-31", "title": "NAI — Minimum On Time", "front": "Why is NAI recommended to remain on for a minimum period once activated, and how long?", "back": "NOTE: Turning NAI on and off in quick succession in flight may cause a \"No Dispatch\" annunciation. It is recommended that NAI remains ON for a minimum of 2 MINUTES when activated, to let the Tt2 sensor heat stabilize and clear all moisture from the probe.\nAnticipate ice-crystal icing by operating NAI near unstable cumuliform (convective) and high-altitude stratiform clouds.", "reference": "AFM 24.7.1 (p 2-1-37)", "topic": "Icing"}, {"id": "AFM-32", "title": "Ice Detection and Wing Inspection Light", "front": "1. Is the PFID system operative on the ground — ?\n2. When must the wing inspection light be operational — ?", "back": "1. No. The PFID system is not operative on the ground, as ice detector signals are not available on the ground. Signals become available as soon as the aircraft is in the air.\n2. The wing inspection light must be operational if flying into known icing conditions at night, or if known icing conditions are forecast at night.", "reference": "AFM 15.4, 15.5 (p 2-1-20)", "topic": "Icing"}, {"id": "AFM-33", "title": "Airbrake Limitations", "front": "1. May you land with the airbrake extended — ?\n2. By what height must the airbrake be stowed on approach — ?", "back": "1. No. Do NOT attempt to land with the airbrake extended.\n2. Use of the airbrake on approach is permitted provided the aircraft is on a STABLE approach and the airbrake is stowed NO LATER THAN 50 ft AGL.", "reference": "AFM 26.1 (p 2-1-39)", "topic": "Flight controls"}, {"id": "AFM-34", "title": "Flap and Stab Trim Limitations", "front": "1. Above what altitude must flaps not be operated in flight — ?\n2. Is landing with Flaps 0° or 8° permitted — ?\n3. When may secondary stab trim be used — ?", "back": "1. Do NOT operate the flaps in flight above 20,000 ft.\n2. Landing with Flaps 0° or 8° is PROHIBITED unless the flaps have failed.\n3. Do NOT use secondary stab trim unless the primary stab trim has failed.", "reference": "AFM 26.2, 26.3 (p 2-1-39)", "topic": "Flight controls"}, {"id": "AFM-35", "title": "Maneuver Limits and Bank Angle", "front": "1. Are acrobatic maneuvers or spins authorized — ?\n2. To what bank angle is operation limited — ?\n3. Load factor limits — ?", "back": "1. No acrobatic maneuvers, including spins, are authorized.\n2. Operation is limited to maneuvers incident to normal flying, stalls (except whip stalls) and steep turns with bank angle NOT MORE THAN 60°.\n3. Flaps up +3.0 g / -1.2 g · Flaps down +2.0 g / -0.0 g", "reference": "AFM 19.3, 19.4 (p 2-1-24)", "topic": "Flight controls"}, {"id": "AFM-36", "title": "Brake Cooling Requirement", "front": "After which two events must the aircraft remain on the ground for a cooling period, and for how long?", "back": "The aircraft must remain on the ground for at least 120 MINUTES following either of these events:\n• Rejected takeoff with brake-on speed greater than VR - 20 kt AND heavy brake usage\n• 0° flap full-stop landing AND heavy brake usage", "reference": "AFM 7.1 (p 2-1-15)", "topic": "Brakes & gear"}, {"id": "AFM-37", "title": "Tire Limits and Towing", "front": "1. Maximum permissible tire speed — ?\n2. What type must the nose tire be — ?\n3. Maximum weight of a towbar-less tug — ?", "back": "1. 165 kt groundspeed\n2. The nose tire must be a \"DUAL CHINE\" tire\n3. 5,379 lb (2,440 kg)\nNOTE: Tug weight influences the force on the nose landing gear if the towbar-less tug needs to brake.", "reference": "AFM 7.2, 18 (p 2-1-15, 2-1-22)", "topic": "Brakes & gear"}, {"id": "AFM-38", "title": "Fuel Quantity — Full Table", "front": "1. Total quantity — ?\n2. Usable quantity — ?\n3. Max permissible imbalance — ?\n4. Unusable fuel quantity — ?\n5. On what density are these based — ?", "back": "1. Total — 895 gal (3,389 l) / 5,999.8 lb (2,721 kg)\n2. Usable — 890 gal (3,369 l) / 5,964 lb (2,705 kg)\n3. Max imbalance — 49 gal (189 l) / 330 lb (150 kg)\n4. Unusable — 5.3 gal (20 l) / 35 lb (16 kg)\n5. Based on fuel temp 59 °F (15 °C) and density 6.7 lb/gal (0.803 kg/l). The weight values are not limiting — higher fuel weights are permitted provided the aircraft stays within the weight limits.", "reference": "AFM Table 2-1-14 (p 2-1-18)", "topic": "Fuel"}, {"id": "AFM-39", "title": "Refueling and Defueling Limits", "front": "1. Maximum refueling pressure — ?\n2. Maximum defueling suction pressure — ?\n3. What must be done with the refuel power switch before departure — ?", "back": "1. Maximum refueling pressure — 60 psi\n2. Maximum defueling suction pressure — 10 psi\n3. The power switch (PWR - REFUEL / DEFUEL) must be OFF and GUARDED prior to departure", "reference": "AFM 13.8 (p 2-1-18)", "topic": "Fuel"}, {"id": "AFM-40", "title": "Approved Fuel Grades — Full List", "front": "List every approved fuel grade with its specification.", "back": "Jet A — ASTM D1655\nJet A-1 — ASTM D1655\nJP-8 — MIL-DTL-83133\nTS-1 — GOST 10227\nChinese No. 3 — GB 6537-2018\nFor Chinese No. 3, these additives are PROHIBITED on the PC-24: T1502 (antistatic), T1602 (antiwear), Ethylene Glycol Methyl Ether (anti-icing).\nNOTE: Fuel meeting ASTM D7566 (synthesized hydrocarbons), redesignated as ASTM D1655, is acceptable.\nThe electric fuel booster pumps and the fuel crossfeed valve must be OPERATIVE. Fuel temp limits -40 °C to +80 °C.", "reference": "AFM 13.1, 13.2 (p 2-1-17)", "topic": "Fuel"}, {"id": "AFM-41", "title": "Oxygen System — Additional Limits", "front": "1. Minimum quantity for dispatch — ?\n2. Below what altitude may the oxygen saver function not be used — ?\n3. Maximum cabin altitude for passenger masks — ?\n4. PBE cockpit temperature limit — ?\n5. Crew mask press-to-test temperature limit after cold soak — ?", "back": "1. 680 liters (and, above 25,000 ft MSL pressurized, 10 min supply per occupant)\n2. Do NOT use the oxygen saver function below 25,000 ft\n3. Passenger oxygen masks are limited to a maximum cabin altitude of 40,000 ft\n4. Do NOT operate the PBE when cockpit temperature is ≤-29 °C (≤-20 °F)\n5. After ground cold soak, do NOT operate the crew oxygen mask press-to-test / reset button when cockpit temperature is ≤-12 °C (≤10 °F)\nCylinder must be filled with Aviators Oxygen per MIL-PRF-27210.", "reference": "AFM 23.1 (p 2-1-28)", "topic": "Oxygen"}, {"id": "AFM-42", "title": "Oxygen — High Field Mode", "front": "What oxygen requirement applies when High Field Mode is active?", "back": "Single pilot operations — the pilot is required to use oxygen CONTINUOUSLY when High Field Mode is active.\nMulti pilot operations — at least ONE pilot is required to use oxygen continuously when High Field Mode is active.", "reference": "AFM 23.2 (p 2-1-28)", "topic": "Oxygen"}, {"id": "AFM-43", "title": "Cabin Pressurization — Warning Range", "front": "Between what values does the maximum cabin NEGATIVE pressure differential exceedance warning occur?", "back": "The negative differential warning occurs between -0.3 and -0.6 psid.\nLimits: max positive differential 9.27 psid · max negative -0.3 psid · max differential for takeoff and landing 0.7 psid.", "reference": "AFM 8 (p 2-1-15)", "topic": "Cabin & loading"}, {"id": "AFM-44", "title": "Baggage vs Cargo — Definitions and Securing", "front": "1. What mass distinguishes baggage from cargo — ?\n2. How must each be secured — ?\n3. Minimum tie-down strap strength — ?\n4. What may be stowed unstrapped — ?", "back": "1. Baggage is any item ≤66 lb (30 kg). Cargo is any item >66 lb (30 kg).\n2. Baggage must be stowed in the restraint system (baggage net). Cargo must be tied down to the seat rails and secured individually with an approved cargo tie down, against a retaining bar secured laterally to the seat rails.\n3. Tie-down straps with a breaking strength of at least 1,800 lb per strap.\n4. Items up to a total weight of 66 lb (30 kg) may be stowed in the cabin unstrapped, provided a cargo net is installed in front of them.\nNo cargo on the seats; cargo must permit free access to the passenger door and the emergency overwing exits.", "reference": "AFM 6, 6.2 (p 2-1-12, 2-1-15)", "topic": "Cabin & loading"}, {"id": "AFM-45", "title": "Baggage / Cargo Clearance and Cargo Door", "front": "1. Clear area forward of the LARGE baggage restraint — ?\n2. Clear area forward of the SMALL baggage restraint — ?\n3. Clear area in front of cabin cargo — ?\n4. Crosswind limit for cargo door operation / loading — ?", "back": "1. 9.1 in (250 mm) forward of the large baggage restraint system\n2. 7.5 in (190 mm) forward of the small baggage restraint system\n3. 4 in (100 mm) in front of the cargo in the cabin\n4. Do NOT open / close the cargo door or perform cargo loading operations in crosswinds exceeding 60 kt\nA life raft carried in the baggage area must be properly secured and, when required by operating regulations, accessible in flight.", "reference": "AFM 6, 6.1 (p 2-1-12, 2-1-13)", "topic": "Cabin & loading"}, {"id": "AFM-46", "title": "Passenger Seating by Configuration", "front": "State the maximum number of passengers for:\n1. Executive interiors — ?\n2. EX-5S-DIV-1 — ?\n3. EX-5S-COM-1S-DIV-1 and EX-6S-DIV-1 — ?\n4. Commuter interior — ?\n5. What restrictions apply to children and divans — ?", "back": "1. Executive interiors — 8 passengers (one per seat); optional fit allows two additional infants at the first seating row, left and right\n2. EX-5S-DIV-1 — 7 passengers (one per seat, two on the divan)\n3. EX-5S-COM-1S-DIV-1 and EX-6S-DIV-1 — 8 passengers (one per seat, two on the divan)\n4. Commuter interior — 10 passengers (one per seat)\n5. Children only allowed in rows 1 and 2. During taxi, takeoff and landing: no occupant in the forward divan seat; no infants or children in the divan seats; no pregnant women in the divan seats (aft-facing executive seats recommended).\nIn single pilot operation an additional passenger may occupy the RH cockpit seat.", "reference": "AFM 19.5 (p 2-1-25)", "topic": "Cabin & loading"}, {"id": "AFM-47", "title": "Battery Charging Voltage Ceiling", "front": "The voltage for charging the batteries must not exceed what value?", "back": "The voltage for charging the batteries must not exceed 32 V.\nRelated: generator max voltage 29.5 Vdc · GPU 25.0-29.5 Vdc · min voltage to charge batteries 28.0 Vdc · max voltage to charge batteries 29.5 Vdc.", "reference": "AFM 11.2 (p 2-1-16)", "topic": "Electrical"}, {"id": "AFM-48", "title": "Circuit Breakers — Reset Rules", "front": "1. May CBs be reset in flight — ?\n2. How many reset attempts on an Essential Bus CB, and under what conditions — ?\n3. What does \"reset\" mean procedurally — ?\n4. Where must extreme caution be exercised — ?", "back": "1. Do NOT reset CBs in flight, EXCEPT when required by a procedural step in Section 3, 3A or 4, or if the PIC judges the reset necessary for safe completion of the flight.\n2. Only ONE attempt, if the PIC determines the system is needed for safe completion of that flight, after at least ONE MINUTE has elapsed since the trip, and only if there is no remaining smoke or burning smell.\n3. Reset = OPEN (pull out) the CB, wait approximately 2 seconds, then CLOSE (push in). If a CB is found already open, reset means simply close it.\n4. Fuel pumps and/or fuel quantity indication systems — arcing might ignite fuel or fuel vapors.", "reference": "AFM 9 (p 2-1-15), Section 3 General (p 3-1-1)", "topic": "Electrical"}, {"id": "AFM-49", "title": "Dual Engine Failure — Glide Speed", "front": "Both engines have failed. Per the AFM WARNING, what speed is recommended with flaps up, and what protection is lost?", "back": "WARNING: AVOID STALL — SHAKER AND PUSHER ARE UNAVAILABLE. WITH FLAPS UP, 150 KIAS IS RECOMMENDED AS A SAFE SPEED WITH GOOD GLIDE PERFORMANCE.\nProcedure order (3-ENG-01): 1. Airspeed — As required · 2. Cabin Altitude — Monitor · 3. Emergency Descent 3-NAE-02 — Accomplish · at or below 25,000 ft: 4. Engine Airstart 3-NAE-03 — Accomplish · if no airstart successful: 5. Forced Landing 3-NAE-15\nCAUTION: Start with the engine deemed most likely to relight successfully.\nNOTE: 3-ENG-01 has NO red memory-item box — step 1 is not a boxed memory item.", "reference": "AFM 3-ENG-01 (p 3-13-1)", "topic": "Emergency knowledge"}, {"id": "AFM-50", "title": "Engine Airstart — Starter Assist Limits", "front": "For a starter-assisted airstart:\n1. Battery voltage to confirm — ?\n2. Airspeed limit if only battery power is available — ?\n3. N2 required before selecting RUN — ?\n4. When must you not airstart at all — ?", "back": "1. BAT 2 — Confirm ON / above 23.0 V. If <23.0 V, consider a windmill airstart.\n2. CAUTION: If ONLY battery power is available (after loss of all generated power), only a starter-assisted airstart is permitted, and airspeed must be ≤150 KIAS (ensuring N2 <10%). Attempting a starter-assisted airstart above 150 KIAS may cause loss of BOTH FADEC channels.\n3. ENG switch — check N2 below 24%, then select RUN.\n4. Do NOT airstart if engine integrity is in question or after an engine fire.", "reference": "AFM 3-NAE-03 (p 3-3-3)", "topic": "Emergency knowledge"}, {"id": "AFM-51", "title": "Engine Fire — Second Extinguisher", "front": "After firing the first extinguisher bottle and the fire CAS message remains:\n1. What confirms the second bottle is available — ?\n2. May the engine be restarted after a confirmed fire — ?", "back": "1. CONFIRM green \"2\" illuminated approximately 30 sec after firing the first extinguisher, then push the associated EXTINGUISHER push button.\n2. CAUTION: Do NOT restart the engine after a confirmed engine fire.\nAlso: BLEED Rotary Selector — select operating engine side; FUEL — monitor balance; FUEL X-FEED should be closed prior to landing; Aircraft — land as soon as possible.", "reference": "AFM 3-FIRE-01 (p 3-15-1)", "topic": "Emergency knowledge"}, {"id": "AFM-52", "title": "Landing — Nose Landing Gear Unlocked", "front": "Nose L/G indicates unlocked. State the key actions.", "back": "1. L/G position — attempt to confirm by exterior means\n2. CPCS DUMP pushbutton — when below 10,000 ft AMSL, push to DUMP\n3. Landing configuration — FLAPS 33°\n4. Aircraft — touch down with normal landing attitude, gently lower the nose to the ground while the elevator remains effective; do NOT use the brakes until the nose gear is on the ground\nIf L/G collapses during touchdown or if considered appropriate — accomplish Emergency Evacuation 3-EVAC-01.\nNOTE: Consider pressing AURAL DISABLE to suppress \"Gear Gear\" and TAWS callouts.", "reference": "AFM 3-NAE-18 (p 3-6-x)", "topic": "Emergency knowledge"}, {"id": "AFM-53", "title": "\"Land as Soon as Possible\" vs \"Practical\"", "front": "Define the two AFM landing urgency terms.", "back": "LAND AS SOON AS POSSIBLE — land without delay at the nearest airport where a safe approach and landing is reasonably assured.\nLAND AS SOON AS PRACTICAL — the landing airport and duration of flight are at the discretion of the pilot. Extended flight beyond the nearest suitable airport is not recommended.", "reference": "AFM Section 3 General (p 3-1-1)", "topic": "General ops"}, {"id": "AFM-54", "title": "Memory Items — Definition and Marking", "front": "How does the AFM define a memory item, and how are memory items marked?", "back": "A memory item is a check for an abnormal or emergency situation that requires IMMEDIATE action and is therefore carried out from memory, without prior reference to a checklist. Memory items are executed by heart without referring to a checklist. A specific checklist may be required to complete the action if the memory items cover only the initial actions.\nMemory items are denoted by a SOLID RED BOX around specific challenge and response items.", "reference": "AFM Section 3 General §3, Section 3A General §3", "topic": "General ops"}, {"id": "AFM-55", "title": "Minimum Flight Crew and Kinds of Operation", "front": "1. Minimum required flight crew — ?\n2. Certification category — ?\n3. Approved kinds of operation — ?", "back": "1. One pilot in the LEFT HAND seat.\n2. Commuter Category (approved based on CS-23 through Amendment 3).\n3. VFR Day · VFR Night · IFR Day including automatic approaches to CAT I minimums, single pilot · IFR Night including automatic approaches to CAT I minimums, single pilot · Flight Into Known Icing (FIKI).\nAll installed equipment shall be operative at dispatch (normally indicated by the absence of CAS messages) unless an approved (M)MEL is used.", "reference": "AFM 12, 17 (p 2-1-17, 2-1-22)", "topic": "General ops"}, {"id": "AFM-56", "title": "Required Documentation On Board", "front": "Which documents must be aboard in PAPER, and which may be electronic or paper?", "back": "PAPER (hard copy), readily accessible to the pilot:\n• PC-24 Airplane Flight Manual (AFM) Report No. 02371, Cockpit Handbook Volumes 1 and 2\nELECTRONIC (digital) OR PAPER, for reference:\n• PC-24 Quick Reference Handbook (QRH) Report No. 02382\n• Advanced Cockpit Environment (ACE) Avionics System Pilot's Guide applicable to that serial number's software/hardware configuration\n• PC-24 Flight Crew Operating Manual (Document No. 02383)\nThe AFM must be carried in the airplane at all times.", "reference": "AFM 2 (p 2-1-1)", "topic": "General ops"}, {"id": "AFM-57", "title": "Wet Runway — Definition", "front": "How does the AFM define a wet runway?", "back": "A runway whose surface is covered with a layer of water LESS THAN 1/8 in (3 mm) in depth, or the equivalent amount of a related substance, or has a sufficient level of moisture to give a REFLECTIVE APPEARANCE — but WITHOUT any significant area of standing water.\nApproved surfaces: dry and wet paved runways. Contaminated paved runways per AFM Supplement 02442. With the gravel kit (stone guard) installed: dry/wet prepared dirt-sand-gravel per Supplement 02444, dry/wet prepared grass per Supplement 02473.", "reference": "AFM 3 (p 2-1-1)", "topic": "General ops"}, {"id": "AFM-58", "title": "Extended Temperature Envelope — Minimum Mach", "front": "For the extended operating temperature envelope (OAT < -65 °C), state the minimum operating speed for each temperature.", "back": "-66 °C — 0.59 M\n-67 °C — 0.62 M\n-68 °C — 0.65 M\n-69 °C — 0.68 M\n-70 °C — 0.70 M\n-71 °C — 0.73 M\nThe minimum operating speed provides adequate aerothermodynamic heating to maintain minimum skin and local ambient (zone) temperatures.\nSea level limits: min OAT -54 °C (-65 °F) · max OAT +50 °C (122 °F). Max operating altitude 45,000 ft (13,716 m).", "reference": "AFM 22.2 (p 2-1-26)", "topic": "General ops"}, {"id": "AFM-59", "title": "RVSM — Required Equipment and Critical Area", "front": "1. What equipment must be operational to enter RVSM airspace — ?\n2. What are the dimensions of the RVSM critical area — ?\n3. May the ESIS be used for RVSM — ?", "back": "1. Two primary Air Data Systems (ADS) · one flight controller KMC 9200A with altitude pre-selector · one automatic flight control system · one altitude reporting transponder KXP 2290A.\n2. An area 24 in (0.6 m) FORWARD, and 12 in (0.3 m) above, below and AFT of the pitot-static tube — must be free of paint ridges/flaking, dents, skin deformation/delamination, loose or missing rivets and fasteners, nicks, scoring/scratches and corrosion. Nose doors closed and latched, panel edges flush.\n3. No. The ESIS has not been demonstrated to meet RVSM performance requirements and shall only be used for emergency procedures.", "reference": "AFM 25 (p 2-1-37, 2-1-38)", "topic": "General ops"}, {"id": "AFM-60", "title": "FMS — Conditions for Instrument Approaches", "front": "Use of the FMS to conduct instrument approaches is permitted provided what five conditions are met?", "back": "• The reference coordinate datum system for the approach is WGS-84, AND\n• The approach is an approved instrument approach procedure, AND\n• The approach is retrieved from the FMS database, AND\n• APP (approach active) mode is annunciated at the Final Approach Fix, AND\n• The approach is NOT any of these prohibited types: ILS, LOC, LOC-BC, LDA, SDF, MLS\nFMS use for IFR requires the most current database update cycle. The PIC must verify FMS-managed speeds do not violate published procedural speeds.", "reference": "AFM 4.3.1, 4.3.2 (p 2-1-4)", "topic": "General ops"}, {"id": "AFM-61", "title": "VNAV / LNAV Approach Limitations", "front": "1. What must remain the primary altitude reference when using VNAV — ?\n2. Which minimums are controlling — ?\n3. What is the CAUTION about the VNAV deviation indicator — ?", "back": "1. The BAROMETRIC ALTIMETER must be used as the primary altitude reference at all times.\n2. The published LNAV/VNAV minimums on the approach chart are controlling; all operations below them must be conducted by outside visual reference. On an LNAV approach us
